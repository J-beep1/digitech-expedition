<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SuperNash: Heroes vs. Villains</title>
<style>
  :root {
    --bg: #14171c;
    --arena: #1d2129;
    --line: #3a4150;
    --p1: #ff5e5e;
    --p2: #5ec4ff;
    --white: #eef1f5;
    --accent: #ffcf4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    color: var(--white);
    gap: 10px;
    padding: 16px;
  }
  h1 {
    letter-spacing: 2px;
    font-size: 19px;
    margin: 0;
    text-transform: uppercase;
    text-align: center;
  }
  #wrap {
    position: relative;
    border: 3px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--arena);
    width: 100%;
    max-width: 900px;
  }
  canvas { display: block; width: 100%; height: auto; }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(10,12,16,0.9);
    gap: 12px;
    overflow-y: auto;
    padding: 16px 0;
  }
  #overlay.show { display: flex; }
  #overlay .msg {
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
  }
  #charGrid {
    display: grid;
    grid-template-columns: repeat(6, 50px);
    gap: 7px;
    max-width: 350px;
  }
  .char-btn {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    background: #000;
    transition: border-color 0.15s, transform 0.15s;
  }
  .char-btn:hover { transform: scale(1.06); }
  .char-btn.selected { box-shadow: 0 0 0 2px var(--accent); }
  .char-btn.selected-p1 { border-color: var(--p1); }
  .char-btn.selected-p2 { border-color: var(--p2); }
  .char-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .char-btn { position: relative; }
  .char-btn.locked { cursor: not-allowed; }
  .char-btn.locked img { filter: grayscale(1) brightness(0.35); }
  .lock-badge {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    pointer-events: none;
  }
  #charSelectPrompt { font-size: 14px; letter-spacing: 1px; color: #cdd3dd; text-transform: none; }
  button {
    font-family: inherit;
    background: var(--accent);
    color: #14171c;
    border: none;
    padding: 10px 22px;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { filter: brightness(1.1); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 40px;
    font-size: 12px;
    color: #8a93a3;
    text-align: center;
    max-width: 900px;
  }
  .controls b { color: var(--white); }
</style>
</head>
<body>
<h1>SuperNash: Heroes vs. Villains</h1>
<div id="wrap">
  <canvas id="game" width="900" height="480"></canvas>
  <div id="overlay">
    <div class="msg" id="overlayMsg">Ready?</div>
    <div style="display:flex; gap:10px;">
      <button id="modeAI">Vs AI</button>
      <button id="mode2P">Vs Player 2</button>
    </div>
    <div style="display:flex; gap:10px;">
      <button id="camWide">Wide View</button>
      <button id="camShoulder">Over-Shoulder Cam</button>
    </div>
    <div style="display:flex; gap:10px;">
      <button id="hardModeBtn">Hard Mode: Off</button>
    </div>
    <div id="charSelectPrompt">Player 1: choose your fighter</div>
    <div id="charGrid"></div>
    <button id="startBtn" disabled>Choose a fighter first</button>
  </div>
</div>
<div class="controls">
  <div><b style="color:var(--p1)">Player 1</b><br>A/D move · W jump (2x in air) · S fast-fall / block on ground<br>F punch · G kick</div>
  <div><b style="color:var(--p2)" id="p2Label">Player 2 (AI)</b><br><span id="p2ControlsText">Computer controlled</span></div>
</div>

  STOCKS: 3,

  DAMAGE_SCALE: 1.8     // attacks hit a lot harder
};

/* =========================================================
   ATTACKS
   ========================================================= */
const ATTACKS = {
  punch: { startup: 6, active: 6, recovery: 10, range: 55, damage: 6, baseKnockback: 5, knockbackScale: 0.32, angle: 42 },
  kick:  { startup: 10, active: 8, recovery: 16, range: 65, damage: 11, baseKnockback: 7, knockbackScale: 0.48, angle: 55 }
};

const POWER_SCALE = { 1: 0.78, 2: 0.90, 3: 1.00, 4: 1.15, 5: 1.32 };
const TIME_SCALE  = { 1: 0.70, 2: 0.85, 3: 1.00, 4: 1.15, 5: 1.30 };

function getAttackData(f) {
  const base = ATTACKS[f.attackType];
  const power = f.charData ? f.charData.power : 3;
  const powerScale = POWER_SCALE[power] || 1.0;
  const timeScale = TIME_SCALE[power] || 1.0;
  const hardScale = GameState.hardMode ? HARD_MODE.DAMAGE_SCALE : 1.0;
  return {
    ...base,
    range: base.range * powerScale,
    damage: base.damage * powerScale * hardScale,
    baseKnockback: base.baseKnockback * powerScale * hardScale,
    knockbackScale: base.knockbackScale * powerScale * hardScale,
    startup: Math.round(base.startup * timeScale),
    active: Math.max(1, Math.round(base.active * timeScale)),
    recovery: Math.round(base.recovery * timeScale)
  };
}

/* =========================================================
   FIGHTER
   ========================================================= */
class Fighter {
  constructor({ id, name, spawnX, controls, isAI = false }) {
    this.id = id;
    this.name = name;
    this.spawnX = spawnX;
    this.controls = controls;
    this.isAI = isAI;
    this.charData = null;
    this.color = '#ffffff';
    this.reset();
  }
  reset() {
    this.x = this.spawnX;
    this.y = GROUND_Y;
    this.vx = 0; this.vy = 0;
    this.facing = this.id === 'p1' ? 1 : -1;
    this.state = 'idle'; // idle, walk, jump, attack, tumble, ko, respawn
    this.attackType = null;
    this.attackTimer = 0;
    this.attackHasHit = false;
    this.hitstunTimer = 0;
    this.invuln = CONFIG.RESPAWN_INVULNERABILITY;
    this.jumpsLeft = 2;
    this.onGround = true;
    this.onPlatform = false;
    this.platformY = null;
    this.walkCycle = 0;
    this.respawnTimer = 0;
    this.percent = 0;
    this.stocks = CONFIG.MAX_STOCKS;
    this.coins = 0;
  }
}

const p1 = new Fighter({ id: 'p1', name: 'Player 1', spawnX: 300, controls: { left: 'a', right: 'd', jump: 'w', down: 's', punch: 'f', kick: 'g' }, isAI: false });
const p2 = new Fighter({ id: 'p2', name: 'Player 2', spawnX: 600, controls: { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', down: 'ArrowDown', punch: 'k', kick: 'l' }, isAI: true });
const fighters = [p1, p2];

function getOpponent(fighter) { return fighter === p1 ? p2 : p1; }
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

/* =========================================================
   CHARACTER SELECT
   ========================================================= */
const charGridEl = document.getElementById('charGrid');
const charSelectPrompt = document.getElementById('charSelectPrompt');
let unlockedIds = new Set();

function isLocked(c) { return c.locked && !unlockedIds.has(c.id); }

CHARACTERS.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'char-btn';
  btn.title = isLocked(c) ? `${c.name} (locked — ${c.unlockHint})` : c.name;
  btn.innerHTML = `<img src="${c.image}" alt="${c.name}">${c.locked ? '<span class="lock-badge">🔒</span>' : ''}`;
  if (isLocked(c)) btn.classList.add('locked');
  btn.addEventListener('click', () => selectCharacter(c, btn));
  charGridEl.appendChild(btn);
});

function refreshLockedButtons() {
  [...charGridEl.children].forEach((btn, i) => {
    const c = CHARACTERS[i];
    if (!c.locked) return;
    const badge = btn.querySelector('.lock-badge');
    if (isLocked(c)) {
      btn.classList.add('locked');
      btn.title = `${c.name} (locked — ${c.unlockHint})`;
      if (badge) badge.style.display = '';
    } else {
      btn.classList.remove('locked');
      btn.title = c.name;
      if (badge) badge.style.display = 'none';
    }
  });
}

function selectCharacter(character, btnEl) {
  if (isLocked(character)) return;

  if (!GameState.selected.p1) {
    GameState.selected.p1 = character;
    [...charGridEl.children].forEach(b => b.classList.remove('selected-p1'));
    btnEl.classList.add('selected', 'selected-p1');

    if (GameState.mode === 'ai') {
      GameState.selected.p2 = chooseAICharacter(character);
      finishCharacterSelection();
    } else {
      charSelectPrompt.textContent = 'Player 2: choose your fighter';
    }
    return;
  }

  GameState.selected.p2 = character;
  [...charGridEl.children].forEach(b => b.classList.remove('selected-p2'));
  btnEl.classList.add('selected', 'selected-p2');
  finishCharacterSelection();
}

function chooseAICharacter(playerCharacter) {
  const available = CHARACTERS.filter(c => c.id !== playerCharacter.id && !isLocked(c));
  return available[randomInt(0, available.length - 1)];
}

function finishCharacterSelection() {
  const { p1: c1, p2: c2 } = GameState.selected;
  charSelectPrompt.textContent = `${c1.name} vs ${c2.name} — ready!`;
  startBtn.disabled = false;
  startBtn.textContent = 'Start Fight';
}

function resetCharacterSelection() {
  GameState.selected.p1 = null;
  GameState.selected.p2 = null;
  charSelectPrompt.textContent = 'Player 1: choose your fighter';
  startBtn.disabled = true;
  startBtn.textContent = 'Choose a fighter first';
  [...charGridEl.children].forEach(b => b.classList.remove('selected', 'selected-p1', 'selected-p2'));
}

function setGameMode(mode) {
  GameState.mode = mode;
  p2.isAI = mode === 'ai';
  p2Label.textContent = mode === 'ai' ? 'Player 2 (AI)' : 'Player 2';
  p2ControlsText.innerHTML = mode === 'ai'
    ? 'Computer controlled'
    : '◀/▶ move · ▲ jump (2x) · ▼ fast-fall<br>K punch · L kick';
  modeAIBtn.style.opacity = mode === 'ai' ? 1 : 0.55;
  mode2PBtn.style.opacity = mode === 'ai' ? 0.55 : 1;
  resetCharacterSelection();
}
modeAIBtn.addEventListener('click', () => setGameMode('ai'));
mode2PBtn.addEventListener('click', () => setGameMode('2p'));
setGameMode('ai');

/* =========================================================
   MATCH MANAGEMENT
   ========================================================= */
function startMatch(char1, char2) {
  pickTheme();

  p1.reset();
  p2.reset();
  p1.charData = char1; p1.color = char1.color;
  p2.charData = char2; p2.color = char2.color;

  if (GameState.hardMode) {
    p1.stocks = HARD_MODE.STOCKS;
    p2.stocks = HARD_MODE.STOCKS;
  }

  GameState.running = true;
  GameState.timer = GameState.hardMode ? HARD_MODE.MATCH_TIME : CONFIG.MATCH_TIME;
  GameState.winner = null;
  GameState.coins.length = 0;
  GameState.coinSpawnTimer = 60;
  GameState.shake = 0;

  particles = [];
  resetHazards();
  clearAIState();

  overlay.classList.remove('show');
}

function endMatch(msg) {
  GameState.running = false;
  GameState.winner = msg;
  overlayMsg.textContent = msg;
  overlay.classList.add('show');
  overlay.scrollTop = 0; // always show the result message, not wherever the overlay was scrolled to
}

startBtn.addEventListener('click', () => {
  const { p1: c1, p2: c2 } = GameState.selected;
  if (!c1 || !c2) return;
  startMatch(c1, c2);
});

/* =========================================================
   FIGHTER UPDATE
   ========================================================= */
function updateFighter(fighter, opponent) {
  if (fighter.invuln > 0) fighter.invuln--;

  if (fighter.state === 'respawn') {
    fighter.respawnTimer--;
    if (fighter.respawnTimer <= 0) fighter.state = 'idle';
    return;
  }

  fighter.facing = fighter.x < opponent.x ? 1 : -1;

  if (fighter.state === 'tumble') {
    fighter.hitstunTimer--;
    if (fighter.hitstunTimer <= 0 && fighter.onGround) fighter.state = 'idle';
  }

  const canAct = fighter.state !== 'attack' && fighter.state !== 'tumble' && fighter.state !== 'ko' && fighter.state !== 'respawn';

  if (canAct) {
    const input = getFighterInput(fighter);
    moveFighter(fighter, input);
  }

  updatePhysics(fighter);

  if (fighter.state === 'attack') {
    updateAttack(fighter, opponent);
  }

  checkForKO(fighter);

  fighter.walkCycle += fighter.state === 'walk' ? 0.35 : 0;
}

function getFighterInput(fighter) {
  if (fighter.isAI) return AI.getInput(fighter, getOpponent(fighter));
  const c = fighter.controls;
  return {
    left: Input.isDown(c.left),
    right: Input.isDown(c.right),
    jump: Input.isDown(c.jump),
    down: Input.isDown(c.down),
    punch: Input.isDown(c.punch),
    kick: Input.isDown(c.kick)
  };
}

function moveFighter(fighter, input) {
  const moveX = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const speed = fighter.onGround ? CONFIG.MOVE_SPEED : CONFIG.MOVE_SPEED * CONFIG.AIR_CONTROL;
  fighter.vx = moveX * speed;
  fighter.x += fighter.vx;
  fighter.state = moveX !== 0 && fighter.onGround ? 'walk' : (fighter.onGround ? 'idle' : 'jump');

  if (input.jump) jump(fighter);

  if (input.down && !fighter.onGround && fighter.vy > 0) {
    fighter.vy += CONFIG.FASTFALL_BOOST;
  }

  // Hard Mode: standing completely still (no direction held, on the ground) blocks attacks —
  // you have to be moving (or already airborne) to throw a punch or kick.
  const canAttack = !GameState.hardMode || moveX !== 0 || !fighter.onGround;
  if (canAttack) {
    if (input.punch) startAttack(fighter, 'punch');
    else if (input.kick) startAttack(fighter, 'kick');
  }
}

function jump(fighter) {
  if (fighter.jumpsLeft <= 0) return;
  fighter.vy = CONFIG.JUMP_FORCE;
  fighter.jumpsLeft--;
  fighter.onGround = false;
  if (!fighter.isAI) Input.keys.delete(fighter.controls.jump); // consume so holding doesn't multi-trigger
}

/* =========================================================
   PHYSICS  (ground + platforms + blast zones, all four sides)
   ========================================================= */
function updatePhysics(fighter) {
  fighter.vy += CONFIG.GRAVITY;
  fighter.y += fighter.vy;
  if (fighter.state === 'tumble') fighter.x += fighter.vx * 0.3; // slight drift while tumbling

  fighter.onGround = false;
  fighter.onPlatform = false;
  fighter.platformY = null;

  if (fighter.y >= GROUND_Y && fighter.x > STAGE_LEFT - 40 && fighter.x < STAGE_RIGHT + 40) {
    fighter.y = GROUND_Y; fighter.vy = 0; fighter.onGround = true; fighter.jumpsLeft = 2;
    if (fighter.state === 'jump' || fighter.state === 'tumble') { if (fighter.hitstunTimer <= 0) fighter.state = 'idle'; }
  } else if (fighter.vy > 0) {
    for (const p of PLATFORMS) {
      if (fighter.y >= p.y && fighter.y - fighter.vy < p.y && fighter.x > p.left && fighter.x < p.right) {
        fighter.y = p.y; fighter.vy = 0; fighter.onGround = true; fighter.onPlatform = true; fighter.platformY = p.y; fighter.jumpsLeft = 2;
        if (fighter.state === 'jump') fighter.state = 'idle';
        break;
      }
    }
  }
}

/* =========================================================
   COMBAT
   ========================================================= */
function startAttack(fighter, type) {
  if (fighter.state === 'attack' || fighter.state === 'tumble' || fighter.state === 'respawn') return;
  fighter.state = 'attack';
  fighter.attackType = type;
  fighter.attackTimer = 0;
  fighter.attackHasHit = false;
}

function updateAttack(fighter, opponent) {
  const data = getAttackData(fighter);
  fighter.attackTimer++;
  const total = data.startup + data.active + data.recovery;

  if (fighter.attackTimer >= data.startup && fighter.attackTimer < data.startup + data.active && !fighter.attackHasHit) {
    const reach = fighter.x + fighter.facing * data.range;
    if (Math.abs(reach - opponent.x) < 40 && Math.abs(fighter.y - opponent.y) < 90) {
      fighter.attackHasHit = true;
      hitOpponent(opponent, fighter, data);
    }
  }
  if (fighter.attackTimer >= total) finishAttack(fighter);
}

function finishAttack(fighter) {
  fighter.state = 'idle';
  fighter.attackType = null;
  fighter.attackTimer = 0;
  fighter.attackHasHit = false;
}

function hitOpponent(target, attacker, data) {
  target.percent += data.damage;
  const dir = target.x < attacker.x ? -1 : 1;
  const power = data.baseKnockback + target.percent * data.knockbackScale;
  const rad = data.angle * Math.PI / 180;
  target.vx = Math.cos(rad) * power * dir;
  target.vy = -Math.sin(rad) * power;
  target.state = 'tumble';
  target.hitstunTimer = Math.max(8, Math.round(power * CONFIG.HITSTUN_MULTIPLIER));
  target.onGround = false;

  spawnParticle(target.x - dir * 10, target.y - 65, getCss('--accent'), Math.round(target.percent) + '%');
  GameState.shake = Math.min(14, power * 0.6);
}

/* =========================================================
   KNOCKOUT / RESPAWN
   ========================================================= */
function checkForKO(fighter) {
  if (fighter.state === 'ko') return;
  if (fighter.x < BLAST_LEFT || fighter.x > BLAST_RIGHT || fighter.y < BLAST_TOP || fighter.y > BLAST_BOTTOM) {
    loseStock(fighter);
  }
}

function loseStock(fighter) {
  fighter.stocks--;
  spawnParticle(fighter.x, fighter.y - 60, '#ff8080', 'KO!');

  if (fighter.stocks <= 0) {
    fighter.state = 'ko';
    fighter.vx = 0; fighter.vy = 0;
    fighter.x = -9999; fighter.y = -9999; // hard-park off canvas so nothing can render at the death spot
    endMatch(fighter === p1 ? 'Player 2 Wins!' : 'Player 1 Wins!');
    return;
  }

  respawnFighter(fighter);
}

function respawnFighter(fighter) {
  fighter.state = 'respawn';
  fighter.respawnTimer = 60;
  fighter.percent = 0;
  fighter.x = fighter.spawnX;
  fighter.y = GROUND_Y - 150;
  fighter.vx = 0; fighter.vy = 0;
  fighter.invuln = CONFIG.RESPAWN_INVULNERABILITY;
}

/* =========================================================
   COINS
   ========================================================= */
let particles = [];

function spawnCoin() {
  const onPlatform = Math.random() < 0.4;
  if (onPlatform) {
    const p = PLATFORMS[Math.floor(Math.random() * PLATFORMS.length)];
    const x = p.left + 20 + Math.random() * (p.right - p.left - 40);
    GameState.coins.push({ x, y: p.y, platformY: p.y, bob: Math.random() * Math.PI * 2, collected: false });
  } else {
    const x = STAGE_LEFT + 40 + Math.random() * (STAGE_RIGHT - STAGE_LEFT - 80);
    GameState.coins.push({ x, y: GROUND_Y, platformY: null, bob: Math.random() * Math.PI * 2, collected: false });
  }
}

function updateCoins() {
  GameState.coinSpawnTimer--;
  if (GameState.coinSpawnTimer <= 0 && GameState.coins.length < CONFIG.MAX_COINS) {
    spawnCoin();
    GameState.coinSpawnTimer = randomInt(CONFIG.COIN_SPAWN_MIN, CONFIG.COIN_SPAWN_MAX);
  }

  for (const coin of GameState.coins) {
    if (coin.collected) continue;
    coin.bob += 0.12;
    for (const fighter of fighters) {
      if (fighter.state === 'respawn' || fighter.state === 'ko') continue;
      if (Math.abs(fighter.x - coin.x) < 26 && Math.abs(fighter.y - coin.y) < 20) {
        collectCoin(fighter, coin);
      }
    }
  }

  GameState.coins = GameState.coins.filter(c => !c.collected);
}

function collectCoin(fighter, coin) {
  coin.collected = true;
  fighter.coins++;
  spawnParticle(fighter.x, fighter.y - 90, '#ffd75e', '+1 coin');
  unlockCharacters(fighter);
  checkSuperNashTransformation(fighter);
}

function unlockCharacters(fighter) {
  CHARACTERS.filter(c => c.locked && !unlockedIds.has(c.id) && fighter.coins >= c.unlockCoins)
    .forEach(c => {
      unlockedIds.add(c.id);
      refreshLockedButtons();
      spawnParticle(fighter.x, fighter.y - 120 - unlockedIds.size * 4, c.color, `${c.name} Unlocked!`);
    });
}

function checkSuperNashTransformation(fighter) {
  if (!fighter.charData || fighter.charData.name !== 'Nash' || fighter.coins < 25) return;
  const superNash = CHARACTERS.find(c => c.name === 'SuperNash');
  if (!superNash) return;

  fighter.charData = superNash;
  fighter.color = superNash.color;
  unlockedIds.add(superNash.id);
  refreshLockedButtons();
  GameState.shake = Math.max(GameState.shake, 10);
  spawnParticle(fighter.x, fighter.y - 140, superNash.color, 'Nash becomes SuperNash!');
}

function drawCoins() {
  GameState.coins.forEach(c => {
    const bobY = c.y - 22 + Math.sin(c.bob) * 4;
    const squish = Math.abs(Math.cos(c.bob * 0.7)) * 0.6 + 0.4; // spin illusion
    ctx.save();
    ctx.translate(c.x, bobY);
    ctx.scale(squish, 1);
    const grad = ctx.createRadialGradient(-3, -3, 1, 0, 0, 10);
    grad.addColorStop(0, '#fff6d0');
    grad.addColorStop(0.5, '#ffd75e');
    grad.addColorStop(1, '#c99a2e');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a87e20';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y + 4, 10, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function spawnParticle(x, y, color, text) {
  particles.push({ x, y, color, text, life: 45 });
}

/* =========================================================
   HAZARDS  (Hard Mode only) — telegraphed meteors fall from above
   ========================================================= */
const HAZARD = {
  WARNING_TIME: 45,   // frames the danger marker shows before impact
  FALL_SPEED: 15,
  DAMAGE: 14,
  KNOCKBACK: 9,
  RADIUS: 22,
  SPAWN_MIN: 180,      // ~3s
  SPAWN_MAX: 360       // ~6s
};

let hazards = [];
let hazardSpawnTimer = HAZARD.SPAWN_MIN;

function resetHazards() {
  hazards = [];
  hazardSpawnTimer = HAZARD.SPAWN_MIN;
}

function updateHazards() {
  if (!GameState.hardMode) return;

  hazardSpawnTimer--;
  if (hazardSpawnTimer <= 0) {
    const x = STAGE_LEFT + 40 + Math.random() * (STAGE_RIGHT - STAGE_LEFT - 80);
    hazards.push({ x, y: BLAST_TOP, vy: 0, warning: HAZARD.WARNING_TIME, falling: false, done: false });
    hazardSpawnTimer = randomInt(HAZARD.SPAWN_MIN, HAZARD.SPAWN_MAX);
  }

  hazards.forEach(h => {
    if (h.done) return;

    if (h.warning > 0) {
      h.warning--;
      if (h.warning <= 0) { h.falling = true; h.vy = HAZARD.FALL_SPEED; }
      return;
    }

    if (h.falling) {
      h.y += h.vy;

      for (const fighter of fighters) {
        if (fighter.state === 'respawn' || fighter.state === 'ko' || fighter.invuln > 0) continue;
        if (Math.abs(fighter.x - h.x) < HAZARD.RADIUS && Math.abs(fighter.y - h.y) < HAZARD.RADIUS) {
          fighter.percent += HAZARD.DAMAGE;
          const dir = fighter.x < h.x ? -1 : 1;
          fighter.vx = HAZARD.KNOCKBACK * dir * (1 + fighter.percent * 0.01);
          fighter.vy = -HAZARD.KNOCKBACK * 0.7;
          fighter.state = 'tumble';
          fighter.hitstunTimer = 20;
          fighter.onGround = false;
          spawnParticle(fighter.x, fighter.y - 65, '#ff6b3d', `+${HAZARD.DAMAGE}%`);
          GameState.shake = Math.max(GameState.shake, 10);
          h.done = true;
          return;
        }
      }

      if (h.y >= GROUND_Y) {
        spawnParticle(h.x, GROUND_Y - 20, '#ff6b3d', 'BOOM');
        GameState.shake = Math.max(GameState.shake, 6);
        h.done = true;
      }
    }
  });

  hazards = hazards.filter(h => !h.done);
}

function drawHazards() {
  hazards.forEach(h => {
    if (h.warning > 0) {
      const pulse = 0.4 + 0.4 * Math.abs(Math.sin(h.warning * 0.25));
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#ff4d2e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(h.x, GROUND_Y - 30);
      ctx.lineTo(h.x, GROUND_Y);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(h.x, GROUND_Y, 18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      return;
    }
    if (h.falling) {
      ctx.save();
      ctx.fillStyle = '#3b2a20';
      ctx.beginPath();
      ctx.arc(h.x, h.y, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff6b3d';
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.arc(h.x, h.y - 16, 5, 0, Math.PI * 2);
      ctx.arc(h.x, h.y - 26, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });
}

/* =========================================================
   AI
   ========================================================= */
const AI = {
  state: { timer: 0, action: { left: false, right: false, jump: false, down: false, punch: false, kick: false } },

  getInput(self, opponent) {
    this.state.timer--;
    let jumpNow = false;
    if (this.state.timer <= 0) {
      this.chooseAction(self, opponent);
      this.state.timer = randomInt(8, 17);
      jumpNow = this.state.action.jump;
    }
    return { ...this.state.action, jump: jumpNow };
  },

  chooseAction(self, opponent) {
    const dist = opponent.x - self.x;
    const absDist = Math.abs(dist);
    const dir = dist > 0 ? 1 : -1;

    const nearLeftEdge = self.x < STAGE_LEFT + 60;
    const nearRightEdge = self.x > STAGE_RIGHT - 60;

    let move = 0;
    if (absDist > 90) move = dir;
    else if (absDist < 45 && Math.random() < 0.3) move = -dir;
    if (nearLeftEdge && move === -1) move = 1;
    if (nearRightEdge && move === 1) move = -1;

    let punch = false, kick = false;
    const canAttack = self.state !== 'attack' && self.state !== 'tumble' && self.state !== 'respawn';
    if (absDist < 80 && canAttack && Math.random() < 0.35) {
      if (Math.random() < 0.5) punch = true; else kick = true;
      if (move === 0) move = dir;
    }
    if (self.stocks < opponent.stocks && absDist < 90 && Math.random() < 0.25) {
      kick = true; punch = false;
      if (move === 0) move = dir;
    }

    this.state.action = {
      left: move === -1,
      right: move === 1,
      jump: Math.random() < 0.04 && self.onGround,
      down: false,
      punch,
      kick
    };
  }
};

function clearAIState() {
  AI.state.timer = 0;
  AI.state.action = { left: false, right: false, jump: false, down: false, punch: false, kick: false };
}

function drawShadow(f) {
  const groundY = f.onPlatform ? f.platformY : GROUND_Y;
  const height = Math.max(0, groundY - f.y);
  const scale = Math.max(0.15, 1 - height / 260);
  ctx.save();
  ctx.globalAlpha = 0.45 * scale;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(f.x, groundY + 4, 26 * scale, 8 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function shade(hex, amt) {
  // lighten/darken a hex color by amt (-1..1)
  const c = hex.replace('#','');
  const num = parseInt(c.length === 3 ? c.split('').map(ch=>ch+ch).join('') : c, 16);
  let r = (num >> 16) & 255, g = (num >> 8) & 255, b = num & 255;
  const f = amt < 0 ? 0 : 255;
  const p = Math.abs(amt);
  r = Math.round((f - r) * p + r);
  g = Math.round((f - g) * p + g);
  b = Math.round((f - b) * p + b);
  return `rgb(${r},${g},${b})`;
}

function limb3D(x1, y1, x2, y2, thickness, color) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const grad = ctx.createLinearGradient(x1 + nx*thickness, y1 + ny*thickness, x1 - nx*thickness, y1 - ny*thickness);
  grad.addColorStop(0, shade(color, 0.35));
  grad.addColorStop(0.5, color);
  grad.addColorStop(1, shade(color, -0.35));
  ctx.strokeStyle = grad;
  ctx.lineWidth = thickness * 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// A filled, tapered capsule (like a real limb with mass) instead of a thin stroked line —
// wider at one end than the other, with rounded caps and simple highlight/outline shading.
function drawFingers(x, y, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.lineCap = 'round';
  [-2.5, 0, 2.5].forEach(fo => {
    ctx.beginPath();
    ctx.moveTo(x + fo, y + 3);
    ctx.lineTo(x + fo * 1.3, y + 6.5);
    ctx.stroke();
  });
}

function bodyLimb(x1, y1, r1, x2, y2, r2, color) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const nx = -dy / len, ny = dx / len;

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1 + nx*r1, y1 + ny*r1);
  ctx.lineTo(x2 + nx*r2, y2 + ny*r2);
  ctx.lineTo(x2 - nx*r2, y2 - ny*r2);
  ctx.lineTo(x1 - nx*r1, y1 - ny*r1);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath(); ctx.arc(x1, y1, r1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x2, y2, r2, 0, Math.PI * 2); ctx.fill();

  // highlight strip along one edge for roundness
  ctx.fillStyle = shade(color, 0.3);
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(x1 + nx*r1*0.7, y1 + ny*r1*0.7);
  ctx.lineTo(x2 + nx*r2*0.7, y2 + ny*r2*0.7);
  ctx.lineTo(x2 + nx*r2*0.15, y2 + ny*r2*0.15);
  ctx.lineTo(x1 + nx*r1*0.15, y1 + ny*r1*0.15);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  // outline for a defined, illustrated look
  ctx.strokeStyle = shade(color, -0.45);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x1 + nx*r1, y1 + ny*r1);
  ctx.lineTo(x2 + nx*r2, y2 + ny*r2);
  ctx.moveTo(x1 - nx*r1, y1 - ny*r1);
  ctx.lineTo(x2 - nx*r2, y2 - ny*r2);
  ctx.stroke();
}

function drawStick(f) {
  if (f.state === 'ko') return; // match-ending KO — don't leave them stuck at the death spot
  drawShadow(f);
  if (f.state === 'respawn') {
    ctx.save();
    ctx.globalAlpha = 0.6;
    const grad = ctx.createRadialGradient(f.x - 4, f.y - 82, 2, f.x, f.y - 78, 14);
    grad.addColorStop(0, shade(f.color, 0.5));
    grad.addColorStop(1, shade(f.color, -0.2));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y - 78, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    return;
  }
  const cd = f.charData;
  const outfit = cd ? cd.outfit : f.color;
  const skin = cd ? cd.skin : f.color;
  const hair = cd ? cd.hair : shade(f.color, -0.4);
  const accent = cd ? cd.accent : shade(f.color, 0.4);
  const accessory = cd ? cd.accessory : 'none';
  const limbColor = (cd && cd.type === 'human' && accessory !== 'labcoat') ? skin : outfit;

  const { x, y, facing, state } = f;
  ctx.save();
  if (f.invuln > 0 && Math.floor(f.invuln / 4) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.translate(x, y);
  ctx.scale(facing, 1);

  let legSwing = Math.sin(f.walkCycle) * 14;
  const facingFootOffset = 1.5;
  let armA = 20, armB = -20, headBob = 0, bodyLean = 0;

  if (state === 'jump') { legSwing = 0; armA = -30; armB = 30; }
  if (state === 'tumble') {
    bodyLean = 20;
    legSwing = 10; armA = -40; armB = 40;
  }
  if (state === 'attack') {
    const data = getAttackData(f);
    const t = f.attackTimer;
    if (f.attackType === 'punch') {
      const progress = Math.min(1, t / (data.startup + data.active));
      armA = 20 - progress * 90;
    } else {
      const progress = Math.min(1, t / (data.startup + data.active));
      legSwing = -progress * 50;
    }
  }

  const armColor = accessory === 'labcoat' ? accent : limbColor;
  const handColor = (cd && cd.type === 'human') ? skin : outfit;
  const shoeColor = shade(outfit, -0.5);

  // back leg first (depth ordering) — slightly offset & darker to suggest volume
  if (accessory === 'dress') {
    ctx.fillStyle = shade(outfit, -0.15);
    ctx.beginPath();
    ctx.moveTo(bodyLean * 0.3, -30);
    ctx.lineTo(bodyLean * 0.6 - 20, 2);
    ctx.lineTo(bodyLean * 0.6 + 20, 2);
    ctx.closePath();
    ctx.fill();
  } else {
    bodyLimb(bodyLean*0.6 - 3, -22, 6, bodyLean*0.6 - legSwing - 3, 1, 4.5, shade(outfit, -0.25));
    ctx.fillStyle = shade(shoeColor, -0.15);
    ctx.beginPath();
    ctx.ellipse(bodyLean*0.6 - legSwing - 3 + facingFootOffset, 2, 8, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // back arm
  bodyLimb(bodyLean*0.3 - 3, -60, 5, bodyLean*0.3 + armB - 3, -40, 3.8, shade(armColor, -0.25));
  ctx.fillStyle = shade(handColor, -0.2);
  ctx.beginPath();
  ctx.arc(bodyLean*0.3 + armB - 3, -40, 4.2, 0, Math.PI * 2);
  ctx.fill();
  drawFingers(bodyLean*0.3 + armB - 3, -40, shade(handColor, -0.3));

  // torso — a real filled body shape (shoulders to hips) instead of a thin line
  const shX = bodyLean * 0.3, shY = -64;
  const hpX = bodyLean * 0.6, hpY = -18;

  // neck connecting head to torso
  ctx.fillStyle = shade(skin, -0.1);
  ctx.beginPath();
  ctx.moveTo(shX - 3.5, shY - 6);
  ctx.lineTo(shX + 3.5, shY - 6);
  ctx.lineTo(shX + 3, shY + 2);
  ctx.lineTo(shX - 3, shY + 2);
  ctx.closePath();
  ctx.fill();

  const torsoGrad = ctx.createLinearGradient(shX - 12, shY, shX + 12, hpY);
  torsoGrad.addColorStop(0, shade(outfit, 0.22));
  torsoGrad.addColorStop(0.55, outfit);
  torsoGrad.addColorStop(1, shade(outfit, -0.25));
  ctx.fillStyle = torsoGrad;
  ctx.beginPath();
  ctx.moveTo(shX - 12, shY + 3);
  ctx.quadraticCurveTo(shX - 12.5, (shY + hpY) / 2, hpX - 7, hpY);
  ctx.lineTo(hpX + 7, hpY);
  ctx.quadraticCurveTo(shX + 12.5, (shY + hpY) / 2, shX + 12, shY + 3);
  ctx.quadraticCurveTo(shX, shY - 5, shX - 12, shY + 3);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = shade(outfit, -0.45);
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // rounded shoulder caps for a less flat silhouette
  ctx.fillStyle = shade(outfit, 0.05);
  [-11, 11].forEach(sxo => {
    ctx.beginPath();
    ctx.arc(shX + sxo, shY + 4, 5, 0, Math.PI * 2);
    ctx.fill();
  });

  // stripes accessory (Fake SuperNash prisoner look)
  if (accessory === 'stripes') {
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    for (let sy = -60; sy <= -20; sy += 8) {
      ctx.beginPath();
      ctx.moveTo(shX - 12, sy);
      ctx.lineTo(shX + 12, sy + 4);
      ctx.stroke();
    }
    ctx.restore();
  }

  // front leg
  if (accessory === 'dress') {
    ctx.fillStyle = outfit;
    ctx.beginPath();
    ctx.moveTo(bodyLean * 0.3, -30);
    ctx.lineTo(bodyLean * 0.6 - 24, 4);
    ctx.lineTo(bodyLean * 0.6 + 24, 4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = shade(outfit, -0.4);
    ctx.lineWidth = 1.4;
    ctx.stroke();
  } else {
    bodyLimb(bodyLean*0.6 + 3, -22, 6, bodyLean*0.6 + legSwing + 3, 1, 4.5, outfit);
    ctx.fillStyle = shoeColor;
    ctx.beginPath();
    ctx.ellipse(bodyLean*0.6 + legSwing + 3 + facingFootOffset, 2, 8, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = shade(shoeColor, -0.35);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // front arm
  bodyLimb(bodyLean*0.3 + 3, -60, 5, bodyLean*0.3 + armA + 3, -40, 3.8, armColor);
  ctx.fillStyle = handColor;
  ctx.beginPath();
  ctx.arc(bodyLean*0.3 + armA + 3, -40, 4.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = shade(handColor, -0.3);
  ctx.lineWidth = 1;
  ctx.stroke();
  drawFingers(bodyLean*0.3 + armA + 3, -40, shade(handColor, -0.25));

  // tentacle/spike embellishments near the torso
  if (accessory === 'tentacles') {
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    [[-10,-50,-22,-38],[10,-50,22,-38]].forEach(([x1,y1,x2,y2]) => {
      ctx.beginPath();
      ctx.moveTo(bodyLean*0.4 + x1, y1);
      ctx.quadraticCurveTo(bodyLean*0.4 + x1*1.4, (y1+y2)/2 - 4, bodyLean*0.4 + x2, y2);
      ctx.stroke();
    });
  }
  if (accessory === 'spikes') {
    ctx.fillStyle = accent;
    [[-8,-56],[6,-60],[-2,-64]].forEach(([sx,sy]) => {
      ctx.beginPath();
      ctx.moveTo(bodyLean*0.35 + sx, sy);
      ctx.lineTo(bodyLean*0.35 + sx - 3, sy + 10);
      ctx.lineTo(bodyLean*0.35 + sx + 3, sy + 10);
      ctx.closePath();
      ctx.fill();
    });
  }

  // head — shaded sphere for volume, using the character's skin/base tone
  const headGrad = ctx.createRadialGradient(bodyLean*0.3 - 4, -82 + headBob, 2, bodyLean*0.3, -78 + headBob, 13);
  headGrad.addColorStop(0, shade(skin, 0.55));
  headGrad.addColorStop(0.6, skin);
  headGrad.addColorStop(1, shade(skin, -0.35));
  ctx.fillStyle = headGrad;
  ctx.beginPath();
  ctx.arc(bodyLean * 0.3, -78 + headBob, 12, 0, Math.PI * 2);
  ctx.fill();

  const hx = bodyLean * 0.3, hy = -78 + headBob;

  // hair (skip for monsters whose "hair" equals their skin — keeps silhouettes clean)
  if (cd ? cd.type === 'human' : true) {
    ctx.fillStyle = hair;
    ctx.beginPath();
    ctx.arc(hx, hy - 6, 11, Math.PI, Math.PI * 2);
    ctx.fill();
  }

  // simple face — gives the head personality instead of a blank circle
  const eyeColor = '#1c1c1c';
  ctx.fillStyle = eyeColor;
  ctx.beginPath();
  ctx.ellipse(hx + 4, hy - 1, 1.6, 2.1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(hx + 9, hy - 1, 1.6, 2.1, 0, 0, Math.PI * 2);
  ctx.fill();

  // eyebrows
  ctx.strokeStyle = shade(hair, -0.2);
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(hx + 2, hy - 5);
  ctx.lineTo(hx + 6, hy - 6);
  ctx.moveTo(hx + 7, hy - 6);
  ctx.lineTo(hx + 11, hy - 5);
  ctx.stroke();

  // small nose
  ctx.strokeStyle = shade(skin, -0.4);
  ctx.lineWidth = 1.1;
  ctx.beginPath();
  ctx.moveTo(hx + 6.5, hy + 1);
  ctx.lineTo(hx + 5.7, hy + 3.3);
  ctx.lineTo(hx + 7, hy + 3.3);
  ctx.stroke();

  ctx.strokeStyle = shade(skin, -0.5);
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(hx + 6.5, hy + 5, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();

  // signature accessory drawn on/around the head
  if (accessory === 'glasses') {
    ctx.strokeStyle = '#1c1c1c';
    ctx.lineWidth = 1.8;
    ctx.strokeRect(hx - 9, hy - 3, 6, 5);
    ctx.strokeRect(hx + 3, hy - 3, 6, 5);
    ctx.beginPath();
    ctx.moveTo(hx - 3, hy - 1); ctx.lineTo(hx + 3, hy - 1);
    ctx.stroke();
  } else if (accessory === 'horns') {
    ctx.fillStyle = accent === '#e0231c' ? '#1c1c1c' : accent;
    [[-7,-1],[7,-1]].forEach(([hxo, dir]) => {
      ctx.beginPath();
      ctx.moveTo(hx + hxo, hy - 8);
      ctx.lineTo(hx + hxo - 3, hy - 20);
      ctx.lineTo(hx + hxo + 3, hy - 10);
      ctx.closePath();
      ctx.fill();
    });
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.arc(hx, hy + 14, 3, 0, Math.PI * 2);
    ctx.fill();
  } else if (accessory === 'hood') {
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.moveTo(hx - 11, hy - 4);
    ctx.lineTo(hx + 11, hy - 4);
    ctx.lineTo(hx, hy - 34);
    ctx.closePath();
    ctx.fill();
  } else if (accessory === 'ears') {
    ctx.fillStyle = skin;
    [[-9,1],[9,-1]].forEach(([exo]) => {
      ctx.beginPath();
      ctx.moveTo(hx + exo, hy - 6);
      ctx.lineTo(hx + exo * 1.6, hy - 22);
      ctx.lineTo(hx + exo * 0.4, hy - 8);
      ctx.closePath();
      ctx.fill();
    });
  } else if (accessory === 'cape_sn') {
    ctx.fillStyle = accent;
    ctx.beginPath();
    ctx.ellipse(bodyLean*0.3, -42, 5, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();

  if (state === 'attack') {
    const data = getAttackData(f);
    if (f.attackTimer >= data.startup && f.attackTimer < data.startup + data.active) {
      ctx.fillStyle = 'rgba(255,207,77,0.35)';
      const rx = x + facing * 20;
      ctx.fillRect(facing === 1 ? rx : rx - data.range, y - 55, data.range, 30);
    }
  }
}

const BACKGROUND_THEMES = [
  { name: 'Dusk',    skyTop: '#0a0c11', skyBottom: '#333c4d', mtnFar: '#14171f', mtnMid: '#1c212d', mtnNear: '#262f40', floorTop: '#181c24', floorBottom: '#333c4c', horizon: '#5a6c85', glow: null, stars: false },
  { name: 'Sunset',  skyTop: '#1a0e22', skyBottom: '#c85a4a', mtnFar: '#26142e', mtnMid: '#3a1c38', mtnNear: '#521f34', floorTop: '#20141f', floorBottom: '#4a2a2c', horizon: '#ff8a4a', glow: { color: '#ffb066', x: 0.7, y: 0.32, r: 110 }, stars: false },
  { name: 'Night',   skyTop: '#020308', skyBottom: '#161d33', mtnFar: '#06070e', mtnMid: '#0c0f1c', mtnNear: '#141a2c', floorTop: '#0e1220', floorBottom: '#1e2540', horizon: '#3a4a72', glow: { color: '#dbe4ff', x: 0.2, y: 0.18, r: 34 }, stars: true },
  { name: 'Forest',  skyTop: '#2a2032', skyBottom: '#e8a878', mtnFar: '#4a3448', mtnMid: '#3a2a3a', mtnNear: '#26202c', floorTop: '#241c1a', floorBottom: '#3a2e22', horizon: '#f2c896',
    glow: { color: '#fbe6c8', x: 0.55, y: 0.42, r: 130 }, stars: false, foliageFrame: true },
  { name: 'Neon',    skyTop: '#05050f', skyBottom: '#26123f', mtnFar: '#0c0818', mtnMid: '#160f28', mtnNear: '#221338', floorTop: '#100a1e', floorBottom: '#2c1848', horizon: '#b95cff', glow: { color: '#c07bff', x: 0.5, y: 0.14, r: 140 }, stars: true },
  { name: 'Moonrise', skyTop: '#141a24', skyBottom: '#3a4658', mtnFar: '#0e131c', mtnMid: '#161d29', mtnNear: '#202836', floorTop: '#161c26', floorBottom: '#2c3646', horizon: '#5a6c80',
    glow: { color: '#f2e6c8', x: 0.5, y: 0.34, r: 150 }, stars: true, bigMoon: true }
];
let currentTheme = BACKGROUND_THEMES[0];
function pickTheme() {
  currentTheme = BACKGROUND_THEMES[Math.floor(Math.random() * BACKGROUND_THEMES.length)];
  starField = Array.from({ length: 60 }, () => ({
    x: Math.random(), y: Math.random() * 0.75, r: Math.random() * 1.4 + 0.3, tw: Math.random() * Math.PI * 2
  }));
  cloudField = Array.from({ length: 5 }, () => ({
    x: Math.random() * canvas.width,
    y: 30 + Math.random() * (GROUND_Y * 0.4),
    r: 20 + Math.random() * 22,
    puffSpread: 16 + Math.random() * 14,
    speed: 0.0015 + Math.random() * 0.002,
    alpha: 0.10 + Math.random() * 0.10
  }));
  groundSpeckles = Array.from({ length: 140 }, () => ({
    t: Math.random(), u: Math.random(), size: 0.6 + Math.random() * 1.8, dark: Math.random() < 0.5
  }));
  // mottled patches across the moon's face (craters/maria), only used when bigMoon is set
  moonMottle = Array.from({ length: 26 }, () => ({
    ang: Math.random() * Math.PI * 2,
    dist: Math.random() * 0.85,
    r: 0.06 + Math.random() * 0.16,
    dark: Math.random() < 0.6
  }));
  // dark, slow-drifting silhouette clouds that pass IN FRONT of the moon/sky (foreground layer)
  silhouetteClouds = Array.from({ length: 4 }, () => ({
    x: Math.random() * canvas.width,
    y: 20 + Math.random() * (GROUND_Y * 0.55),
    r: 45 + Math.random() * 60,
    puffSpread: 30 + Math.random() * 26,
    speed: 0.006 + Math.random() * 0.008,
    alpha: 0.5 + Math.random() * 0.3
  }));
}
let starField = [];
let cloudField = [];
let groundSpeckles = [];
let moonMottle = [];
let silhouetteClouds = [];

function drawArena() {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, currentTheme.skyTop);
  sky.addColorStop(0.7, currentTheme.skyBottom);
  sky.addColorStop(1, currentTheme.horizon);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, GROUND_Y);

  // stars for dark themes
  if (currentTheme.stars) {
    starField.forEach(s => {
      const tw = 0.55 + Math.sin(s.tw + performance.now() * 0.002) * 0.45;
      ctx.globalAlpha = tw;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * GROUND_Y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // optional sun/moon/glow with a bright core for a more realistic light source
  if (currentTheme.glow) {
    const g = currentTheme.glow;
    const gx = canvas.width * g.x, gy = GROUND_Y * g.y;
    const glowGrad = ctx.createRadialGradient(gx, gy, 2, gx, gy, g.r);
    glowGrad.addColorStop(0, g.color);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, canvas.width, GROUND_Y);

    if (currentTheme.bigMoon) {
      // a large, mottled, glowing moon dominating the sky
      const moonR = g.r * 0.82;

      // extra-wide soft halo behind the disc
      const halo = ctx.createRadialGradient(gx, gy, moonR * 0.9, gx, gy, moonR * 2.4);
      halo.addColorStop(0, 'rgba(242,230,200,0.35)');
      halo.addColorStop(1, 'rgba(242,230,200,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(gx, gy, moonR * 2.4, 0, Math.PI * 2);
      ctx.fill();

      // base disc with warm-to-cool shading (lit from upper-left)
      const discGrad = ctx.createRadialGradient(gx - moonR * 0.3, gy - moonR * 0.3, moonR * 0.1, gx, gy, moonR);
      discGrad.addColorStop(0, '#fdf6df');
      discGrad.addColorStop(0.55, '#f2e2b8');
      discGrad.addColorStop(1, '#d9b878');
      ctx.save();
      ctx.beginPath();
      ctx.arc(gx, gy, moonR, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = discGrad;
      ctx.fillRect(gx - moonR, gy - moonR, moonR * 2, moonR * 2);

      // mottled crater/maria texture patches, clipped to the disc
      moonMottle.forEach(m => {
        const mx = gx + Math.cos(m.ang) * m.dist * moonR;
        const my = gy + Math.sin(m.ang) * m.dist * moonR;
        ctx.globalAlpha = m.dark ? 0.10 : 0.14;
        ctx.fillStyle = m.dark ? '#8a744a' : '#fffbe8';
        ctx.beginPath();
        ctx.ellipse(mx, my, m.r * moonR, m.r * moonR * 0.8, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // subtle terminator shading toward the lower-right for roundness
      const shadeGrad = ctx.createRadialGradient(gx + moonR * 0.4, gy + moonR * 0.4, 0, gx, gy, moonR);
      shadeGrad.addColorStop(0, 'rgba(0,0,0,0)');
      shadeGrad.addColorStop(1, 'rgba(60,50,30,0.25)');
      ctx.fillStyle = shadeGrad;
      ctx.fillRect(gx - moonR, gy - moonR, moonR * 2, moonR * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = shade(g.color, 0.6);
      ctx.beginPath();
      ctx.arc(gx, gy, g.r * 0.16, 0, Math.PI * 2);
      ctx.fill();
    }

    // soft volumetric light rays radiating from the source, for a hazy realistic glow
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = g.color;
    ctx.lineWidth = 3;
    for (let i = 0; i < 7; i++) {
      const ang = (i / 7) * Math.PI * 2 + performance.now() * 0.00005;
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx + Math.cos(ang) * g.r * 2.2, gy + Math.sin(ang) * g.r * 2.2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // drifting cloud layer for extra atmosphere
  cloudField.forEach(c => {
    const drift = (performance.now() * c.speed) % (canvas.width + 300);
    const cx = (c.x + drift) % (canvas.width + 300) - 150;
    ctx.save();
    ctx.globalAlpha = c.alpha;
    ctx.fillStyle = shade(currentTheme.skyBottom, 0.5);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.ellipse(cx + i * c.puffSpread, c.y, c.r - i * 6, (c.r - i * 6) * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });

  // dramatic dark silhouette clouds drifting IN FRONT of the moon/sky (bigMoon themes only)
  if (currentTheme.bigMoon) {
    silhouetteClouds.forEach(c => {
      const drift = (performance.now() * c.speed) % (canvas.width + 400);
      const cx = (c.x + drift) % (canvas.width + 400) - 200;
      ctx.save();
      ctx.globalAlpha = c.alpha;
      ctx.fillStyle = shade(currentTheme.skyTop, -0.3);
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.ellipse(cx + i * c.puffSpread, c.y + Math.sin(i) * 8, c.r - i * 10, (c.r - i * 10) * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
  }

  // atmospheric haze band near the horizon — distant things fade toward the horizon color (atmospheric perspective)
  const hazeY = GROUND_Y - 55;
  const haze = ctx.createLinearGradient(0, hazeY - 40, 0, hazeY + 10);
  haze.addColorStop(0, 'rgba(0,0,0,0)');
  haze.addColorStop(1, currentTheme.horizon);
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = haze;
  ctx.fillRect(0, hazeY - 40, canvas.width, 50);
  ctx.globalAlpha = 1;

  // parallax mountain layers for depth (far -> mid -> near, atmospheric perspective via fading contrast)
  // A slight blur on distant layers mimics real depth-of-field / atmospheric softening.
  ctx.filter = 'blur(2.2px)';
  drawMountainLayer(GROUND_Y - 55, 45, currentTheme.mtnFar, 0.015);
  ctx.filter = 'blur(1px)';
  drawMountainLayer(GROUND_Y - 30, 65, currentTheme.mtnMid, 0.03);
  ctx.filter = 'none';
  drawMountainLayer(GROUND_Y - 8, 95, currentTheme.mtnNear, 0.05);

  // perspective floor: vanishing point at horizon, floor widens toward viewer
  const horizonY = GROUND_Y - 50;
  const vpX = canvas.width / 2;
  const floorFar = { lx: vpX - 90, rx: vpX + 90 };
  const floorNear = { lx: STAGE_LEFT - 20, rx: STAGE_RIGHT + 20 };

  const floorGrad = ctx.createLinearGradient(0, horizonY, 0, canvas.height);
  floorGrad.addColorStop(0, currentTheme.horizon);
  floorGrad.addColorStop(0.15, currentTheme.floorTop);
  floorGrad.addColorStop(1, currentTheme.floorBottom);
  ctx.fillStyle = floorGrad;
  ctx.beginPath();
  ctx.moveTo(floorFar.lx, horizonY);
  ctx.lineTo(floorFar.rx, horizonY);
  ctx.lineTo(floorNear.rx, canvas.height);
  ctx.lineTo(floorNear.lx, canvas.height);
  ctx.closePath();
  ctx.fill();

  // ground texture — scattered speckles with atmospheric perspective (smaller/fainter with distance)
  groundSpeckles.forEach(s => {
    const lx = floorFar.lx + (floorNear.lx - floorFar.lx) * s.t;
    const rx = floorFar.rx + (floorNear.rx - floorFar.rx) * s.t;
    const sx = lx + (rx - lx) * s.u;
    const sy = horizonY + (canvas.height - horizonY) * s.t;
    const scale = 0.4 + s.t * 1.1;
    ctx.globalAlpha = 0.10 + s.t * 0.18;
    ctx.fillStyle = s.dark ? shade(currentTheme.floorBottom, -0.4) : shade(currentTheme.floorBottom, 0.35);
    ctx.beginPath();
    ctx.ellipse(sx, sy, s.size * scale, s.size * scale * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // perspective grid lines converging to horizon (depth cue)
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const t = i / 6;
    const lx = floorFar.lx + (floorNear.lx - floorFar.lx) * t;
    const rx = floorFar.rx + (floorNear.rx - floorFar.rx) * t;
    const yy = horizonY + (canvas.height - horizonY) * t;
    ctx.beginPath();
    ctx.moveTo(lx, yy);
    ctx.lineTo(rx, yy);
    ctx.stroke();
  }
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    ctx.moveTo(vpX + i * 30, horizonY);
    ctx.lineTo(vpX + i * 100, canvas.height);
    ctx.stroke();
  }

  // dense foreground foliage framing the edges of the scene (Forest theme)
  if (currentTheme.foliageFrame) drawForestFraming();

  // main stage — floats above the perspective floor, Battlefield-style, with a cast shadow below
  drawFloatingSlab(STAGE_LEFT, STAGE_RIGHT, GROUND_Y, 34, '#262b35', true);

  // the three aerial platforms
  PLATFORMS.forEach(p => drawFloatingSlab(p.left, p.right, p.y, 14, '#2c313d', false));
}

function drawForestFraming() {
  const dark = '#0e140d';
  const mid = '#1c2b17';

  // tall tree trunk silhouettes hugging the far left/right edges, cropped by the canvas
  function trunk(x, w, lean) {
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.moveTo(x, -10);
    ctx.lineTo(x + w, -10);
    ctx.lineTo(x + w + lean, GROUND_Y + 20);
    ctx.lineTo(x + lean, GROUND_Y + 20);
    ctx.closePath();
    ctx.fill();
  }
  trunk(-40, 90, 30);
  trunk(canvas.width - 55, 95, -25);

  // fern/leaf clusters in the bottom corners, framing the "clearing" like the reference
  function fernCluster(cx, cy, scale, flip) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(flip ? -scale : scale, scale);
    for (let i = 0; i < 6; i++) {
      const ang = -0.3 + i * 0.22;
      const len = 70 + (i % 3) * 18;
      ctx.strokeStyle = i % 2 === 0 ? dark : mid;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      const midX = Math.cos(ang) * len * 0.55, midY = -Math.sin(ang) * len * 0.7;
      const endX = Math.cos(ang) * len, endY = -Math.sin(ang) * len * 1.1;
      ctx.quadraticCurveTo(midX, midY, endX, endY);
      ctx.stroke();
      // small leaflets along the frond
      for (let t = 0.3; t < 1; t += 0.22) {
        const lx = midX * t + endX * (1 - t) * 0.3, ly = midY * t + endY * (1 - t) * 0.3;
        ctx.beginPath();
        ctx.ellipse(lx, ly, 10, 4, ang, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }
  fernCluster(30, canvas.height + 10, 1.0, false);
  fernCluster(canvas.width - 20, canvas.height + 10, 1.0, true);
  fernCluster(110, canvas.height + 20, 0.7, false);
  fernCluster(canvas.width - 120, canvas.height + 20, 0.75, true);

  // a few hanging leaf shapes from the top corners
  ctx.fillStyle = dark;
  [[0, 0, 1], [canvas.width, 0, -1]].forEach(([x, y, dir]) => {
    ctx.beginPath();
    ctx.ellipse(x + dir * 40, y + 30, 60, 26, dir * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + dir * 70, y + 55, 45, 20, dir * 0.7, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawSceneVignette() {
  // soft vignette across the whole scene for a more photographic, less flat feel.
  // Drawn in screen space (outside the camera transform) so it always covers the
  // full canvas regardless of zoom level.
  const vig = ctx.createRadialGradient(
    canvas.width / 2, canvas.height * 0.45, canvas.height * 0.35,
    canvas.width / 2, canvas.height * 0.45, canvas.width * 0.65
  );
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.28)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // subtle film grain for texture, so flat gradients don't look too digitally clean
  ctx.save();
  ctx.globalAlpha = 0.05;
  grainField.forEach(g => {
    ctx.fillStyle = g.light ? '#ffffff' : '#000000';
    ctx.fillRect(g.x, g.y, 1, 1);
  });
  ctx.restore();
}
const grainField = Array.from({ length: 500 }, () => ({
  x: Math.random() * 900, y: Math.random() * 480, light: Math.random() < 0.5
}));

function drawFloatingSlab(left, right, topY, thickness, color, castsGroundShadow) {
  const w = right - left;
  const r = Math.min(16, thickness);

  if (castsGroundShadow) {
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse((left + right) / 2, canvas.height - 6, w / 2 + 10, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // underside (darker, gives thickness/volume)
  ctx.fillStyle = shade(color, -0.55);
  ctx.beginPath();
  ctx.moveTo(left, topY + thickness * 0.4);
  ctx.lineTo(right, topY + thickness * 0.4);
  ctx.lineTo(right - r * 0.6, topY + thickness);
  ctx.lineTo(left + r * 0.6, topY + thickness);
  ctx.closePath();
  ctx.fill();

  // top face with rounded corners + gradient for a lit, rounded look
  const topGrad = ctx.createLinearGradient(0, topY, 0, topY + thickness * 0.5);
  topGrad.addColorStop(0, shade(color, 0.3));
  topGrad.addColorStop(1, color);
  ctx.fillStyle = topGrad;
  ctx.beginPath();
  ctx.moveTo(left + r, topY);
  ctx.lineTo(right - r, topY);
  ctx.quadraticCurveTo(right, topY, right, topY + r);
  ctx.lineTo(right, topY + thickness * 0.4);
  ctx.lineTo(left, topY + thickness * 0.4);
  ctx.lineTo(left, topY + r);
  ctx.quadraticCurveTo(left, topY, left + r, topY);
  ctx.closePath();
  ctx.fill();

  // top highlight edge (rim light, sells the rounded top surface)
  ctx.strokeStyle = shade(color, 0.5);
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(left + r, topY + 1.5);
  ctx.lineTo(right - r, topY + 1.5);
  ctx.stroke();

  ctx.strokeStyle = getCss('--line');
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(left + r, topY);
  ctx.lineTo(right - r, topY);
  ctx.quadraticCurveTo(right, topY, right, topY + r);
  ctx.lineTo(right, topY + thickness * 0.4);
  ctx.lineTo(left, topY + thickness * 0.4);
  ctx.lineTo(left, topY + r);
  ctx.quadraticCurveTo(left, topY, left + r, topY);
  ctx.closePath();
  ctx.stroke();
}

function drawMountainLayer(baseY, height, color, jitter) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, baseY);
  const peaks = 7;
  for (let i = 0; i <= peaks; i++) {
    const px = (canvas.width / peaks) * i;
    const py = baseY - height * (0.4 + 0.6 * Math.abs(Math.sin(i * 12.9898 * jitter * 100)));
    ctx.lineTo(px, py);
  }
  ctx.lineTo(canvas.width, baseY);
  ctx.closePath();
  ctx.fill();
}

function drawHUD() {
  drawPlate(20, p1, false);
  drawPlate(canvas.width - 220, p2, true);

  ctx.fillStyle = '#eef1f5';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'center';
  const secs = Math.ceil(GameState.timer / 60);
  ctx.fillText(secs, canvas.width / 2, 30);
  ctx.font = '12px monospace';
  ctx.fillStyle = '#8a93a3';
  ctx.fillText(currentTheme.name, canvas.width / 2, 48);
}

function drawPlate(x, f, flip) {
  const y = canvas.height - 60;
  ctx.textAlign = flip ? 'right' : 'left';
  const tx = flip ? x + 200 : x;
  ctx.fillStyle = f.color;
  ctx.font = 'bold 30px monospace';
  ctx.fillText(Math.round(f.percent) + '%', tx, y);
  ctx.font = '16px monospace';
  ctx.fillStyle = '#8a93a3';
  ctx.fillText('stocks: ' + '●'.repeat(Math.max(0, f.stocks)), tx, y + 22);
  ctx.fillStyle = '#ffd75e';
  ctx.fillText('coins: ' + f.coins, tx, y + 40);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / 45);
    ctx.fillStyle = p.color;
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - (45 - p.life));
    p.life--; p.y -= 0.4;
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}
let camX = (STAGE_LEFT + STAGE_RIGHT) / 2;
let camY = 0;
let camZoom = 1;

function updateCamera() {
  if (GameState.camera === 'wide') {
    const midX = (p1.x + p2.x) / 2;
    const avgY = (p1.y + p2.y) / 2;
    const distX = Math.abs(p1.x - p2.x);
    const distY = Math.abs(p1.y - p2.y);
    // zoom out as the fighters spread apart (knockback, edge-guarding), zoom in when close — like Smash's dynamic camera
    const targetZoom = Math.max(0.6, Math.min(1.18, (canvas.width - 260) / (distX + distY * 0.6 + 260)));
    camX += (midX - camX) * 0.07;
    const targetCamY = -(avgY - GROUND_Y) * 0.3;
    camY += (targetCamY - camY) * 0.07;
    camZoom += (targetZoom - camZoom) * 0.06;
  } else {
    // bias the view toward the opponent so p1 sits low/to-the-side, like looking past their shoulder
    const target = p1.x + (p2.x - p1.x) * 0.22;
    camX += (target - camX) * 0.09;
    const targetY = -(p1.y - GROUND_Y) * 0.35 - 40;
    camY += (targetY - camY) * 0.09;
    camZoom += (1.55 - camZoom) * 0.06;
  }
}

function applyCamera() {
  ctx.translate(canvas.width / 2, canvas.height / 2 + camY);
  ctx.scale(camZoom, camZoom);
  ctx.translate(-camX, -(GROUND_Y - 110));
}

function drawShoulderFrame() {
  if (GameState.camera !== 'shoulder') return;
  // soft dark silhouette in the lower-front corner to sell "looking past p1's shoulder"
  const side = p1.facing >= 0 ? -1 : 1; // shoulder appears on the side p1 is turned away from
  ctx.save();
  const grad = ctx.createRadialGradient(
    canvas.width/2 + side*220, canvas.height + 60, 40,
    canvas.width/2 + side*220, canvas.height + 60, 260
  );
  grad.addColorStop(0, 'rgba(5,6,8,0.9)');
  grad.addColorStop(1, 'rgba(5,6,8,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(canvas.width/2 + side*220, canvas.height + 60, 260, 220, 0, 0, Math.PI*2);
  ctx.fill();
  // vignette edges for a more "in-view" feel
  const vg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.35, canvas.width/2, canvas.height/2, canvas.height*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
}

/* =========================================================
   GAME TIMER  (fixed 60Hz physics step, decoupled from display refresh rate)
   ========================================================= */
let previousTime = performance.now();
let accumulator = 0;
const FIXED_STEP = 1000 / CONFIG.FPS;

function updateMatch() {
  if (!GameState.running) return;

  updateFighter(p1, p2);
  updateFighter(p2, p1);
  updateCoins();
  updateHazards();

  GameState.timer--;
  if (GameState.timer <= 0) determineWinner();
}

function determineWinner() {
  if (p1.stocks !== p2.stocks) {
    endMatch(p1.stocks > p2.stocks ? 'Player 1 Wins!' : 'Player 2 Wins!');
    return;
  }
  if (p1.percent !== p2.percent) {
    endMatch(p1.percent < p2.percent ? 'Player 1 Wins!' : 'Player 2 Wins!');
    return;
  }
  endMatch('Draw!');
}

function gameLoop(currentTime) {
  const delta = Math.min(currentTime - previousTime, 100);
  previousTime = currentTime;
  accumulator += delta;

  while (accumulator >= FIXED_STEP) {
    updateMatch();
    accumulator -= FIXED_STEP;
  }

  render();
  requestAnimationFrame(gameLoop);
}

/* =========================================================
   RENDERING
   ========================================================= */
function render() {
  updateCamera();

  ctx.clearRect(0, 0, canvas.width, canvas.height); // clear BEFORE camera transform so it always covers the full screen

  ctx.save();
  applyScreenShake();
  applyCamera();

  drawArena();
  drawCoins();
  drawHazards();
  drawStick(p1);
  drawStick(p2);
  drawParticles();

  ctx.restore();

  drawSceneVignette();
  drawShoulderFrame();
  drawHUD();
}

function applyScreenShake() {
  if (GameState.shake > 0.2) {
    ctx.translate((Math.random() - 0.5) * GameState.shake, (Math.random() - 0.5) * GameState.shake);
    GameState.shake *= 0.85;
  } else {
    GameState.shake = 0;
  }
}

overlay.classList.add('show');
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
