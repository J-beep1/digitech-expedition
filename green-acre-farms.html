<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Acre Farms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --soil-dark:#3b2e20;
    --soil:#5b4530;
    --ink:#2a2016;
    --paper:#eee3c8;
    --paper-deep:#e2d3ac;
    --wheat-gold:#d7a63f;
    --wheat-gold-deep:#b6832a;
    --field-green-1:#a7c98a;
    --field-green-2:#6ea852;
    --field-green-3:#3e7a3a;
    --stubble:#c2a878;
    --tilled:#6b5238;
    --sown:#8a6e42;
    --hay-mowed:#d9c98a;
    --hay-tedded:#e3d59a;
    --hay-windrowed:#c8ac5e;
    --silage-baled:#a9b98a;
    --withered:#8c7a63;
    --road:#5e5b54;
    --road-line:#e8d24c;
    --track-grass:#6f9c4c;
    --track-dirt:#8a6a44;
    --up:#3a7d3a;
    --down:#a3372e;
    --panel:#f6ecd6;
    --panel-line:#cbb98c;
    --shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #f4e9cd 0%, var(--paper) 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--wheat-gold);color:var(--ink);}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #app{max-width:1180px;margin:0 auto;padding:18px 18px 60px;}

  /* ---------- HEADER ---------- */
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
    background:var(--soil-dark);
    color:var(--paper);
    border-radius:14px;
    padding:16px 22px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    position:relative;
    overflow:hidden;
  }
  header.topbar::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, rgba(215,166,63,0.07) 0 18px, transparent 18px 36px);
    pointer-events:none;
  }
  .brand{display:flex;flex-direction:column;gap:2px;z-index:1;}
  .brand .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--wheat-gold);}
  .brand h1{font-size:23px;font-weight:700;color:var(--paper);letter-spacing:.01em;}
  .stat-cluster{display:flex;gap:22px;align-items:center;z-index:1;flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;align-items:flex-end;}
  .stat .label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#cbb98c;}
  .stat .value{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;color:var(--paper);}
  .stat .value.money{color:var(--wheat-gold);}
  button.next-day{
    z-index:1;
    background:var(--wheat-gold);
    color:var(--ink);
    border:none;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    padding:11px 20px;
    border-radius:9px;
    cursor:pointer;
    box-shadow: var(--shadow);
    transition:transform .08s ease;
  }
  button.next-day:hover{transform:translateY(-1px);background:#e2b451;}
  button.next-day{min-width:118px;}
  button.next-day:active{transform:translateY(1px);box-shadow:none;}
  button.icon-btn{
    z-index:1;
    background:rgba(238,227,200,0.12);
    color:var(--paper);
    border:1px solid rgba(238,227,200,0.35);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  button.icon-btn:hover{background:rgba(238,227,200,0.22);}

  /* ---------- FS25-STYLE SLEEP / TIME ADVANCE ---------- */
  .sleep-screen{
    min-height:88vh;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;border-radius:18px;
    background:linear-gradient(180deg,#07111f 0%,#101c32 52%,#283b51 100%);
    color:#fff;
    --sleep-dur:2.6s;
  }
  .sleep-screen::before{content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 50% 22%,rgba(255,255,255,.16),transparent 30%),
               linear-gradient(180deg,rgba(4,9,18,.15),rgba(4,9,18,.55));}
  /* dusk-to-night-to-dawn light wash, timed to the sleep duration */
  .sleep-dusk-overlay{position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(180deg,rgba(255,150,90,.38),rgba(255,150,90,0) 62%);
    animation:duskFade var(--sleep-dur) linear forwards;}
  .sleep-dawn-overlay{position:absolute;inset:0;pointer-events:none;z-index:1;
    background:linear-gradient(0deg,rgba(255,200,140,.45),rgba(255,200,140,0) 58%);
    animation:dawnFade var(--sleep-dur) linear forwards;}
  @keyframes duskFade{0%{opacity:1;}18%{opacity:0;}100%{opacity:0;}}
  @keyframes dawnFade{0%{opacity:0;}82%{opacity:0;}100%{opacity:1;}}
  /* animated starfield used while actively sleeping */
  .sleep-stars{position:absolute;inset:0;overflow:hidden;z-index:1;}
  .sleep-star{position:absolute;background:#fff;border-radius:50%;opacity:.2;
    box-shadow:0 0 4px 1px rgba(255,255,255,.7);
    animation-name:starTwinkle;animation-iteration-count:infinite;animation-timing-function:ease-in-out;}
  @keyframes starTwinkle{0%,100%{opacity:.15;}50%{opacity:1;}}
  /* static starfield used on the sleep/wake picker */
  .sleep-stars-static{position:absolute;inset:0;opacity:.8;z-index:1;background-image:
    radial-gradient(circle at 12% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 27% 35%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 46% 16%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 68% 28%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 84% 14%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 91% 42%,#fff 0 1px,transparent 2px);}
  /* clouds drifting across while time passes */
  .sleep-clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
  .sleep-cloud-wrap{position:absolute;left:-180px;top:10%;animation-name:cloudDrift;
    animation-timing-function:linear;animation-iteration-count:infinite;}
  .sleep-cloud{display:inline-block;font-size:54px;filter:blur(.3px) drop-shadow(0 4px 6px rgba(0,0,0,.25));}
  @keyframes cloudDrift{from{transform:translateX(0);}to{transform:translateX(calc(100vw + 260px));}}
  /* moon arcing across the sky over the course of the sleep */
  .sleep-moon-arc{position:absolute;inset:0;pointer-events:none;z-index:1;}
  .sleep-moon-arc .sleep-moon{position:absolute;font-size:46px;left:6%;top:60%;
    filter:drop-shadow(0 0 12px rgba(255,255,255,.55));
    animation-name:moonArc;animation-duration:var(--sleep-dur);animation-timing-function:linear;
    animation-iteration-count:1;animation-fill-mode:forwards;}
  @keyframes moonArc{
    0%{left:4%;top:62%;opacity:0;}
    10%{opacity:1;}
    50%{left:47%;top:8%;}
    90%{opacity:1;}
    100%{left:92%;top:60%;opacity:0;}
  }
  .sleep-card{position:relative;z-index:2;text-align:center;min-width:340px;padding:34px 42px;
    background:rgba(8,15,27,.72);border:1px solid rgba(255,255,255,.18);
    border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.35);backdrop-filter:blur(5px);}
  .sleep-card .sleep-moon{font-size:64px;line-height:1;margin-bottom:10px;animation:sleepFloat 2s ease-in-out infinite;}
  .sleep-title{font-size:30px;font-weight:800;letter-spacing:.5px;}
  .sleep-sub{margin-top:8px;color:rgba(255,255,255,.78);font-size:14px;}
  .sleep-clock{margin-top:14px;font-size:34px;font-weight:700;letter-spacing:1px;color:#f3d37a;}
  .sleep-time{margin-top:8px;font-size:16px;font-weight:600;color:rgba(255,255,255,.85);}
  .sleep-bar{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin:22px 0 4px;}
  .sleep-bar-fill{height:100%;width:0;background:#f3d37a;border-radius:99px;animation:sleepProgress var(--sleep-dur) linear forwards;}
  .sleep-hint{font-size:11px;color:rgba(255,255,255,.55);}
  @keyframes sleepProgress{to{width:100%;}}
  @keyframes sleepFloat{50%{transform:translateY(-5px);}}
  /* ---------- SLEEP / WAKE-TIME PICKER ---------- */
  .sleep-screen.setup .sleep-card{min-width:380px;}
  .wake-options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 4px;max-width:320px;}
  .wake-opt{padding:9px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);color:#fff;font-family:'IBM Plex Mono',monospace;
    font-size:13px;cursor:pointer;}
  .wake-opt:hover{background:rgba(255,255,255,.16);}
  .wake-opt.active{background:#f3d37a;color:#2a2016;border-color:#f3d37a;font-weight:700;}
  .sleep-setup-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;}

  /* ---------- MENU / TITLE SCREEN ---------- */
  .menu-screen{
    min-height:88vh;display:flex;align-items:flex-end;justify-content:center;
    padding:20px;position:relative;overflow:hidden;border-radius:18px;
    background:#eeeae2;
  }
  .menu-hero{
    position:absolute;inset:0;width:100%;height:100%;z-index:0;
    display:block;object-fit:cover;object-position:center center;
    image-rendering:auto;
    filter:saturate(.92) contrast(.98);
  }
  .menu-hero-scrim{
    position:absolute;inset:0;z-index:0;
    background:linear-gradient(to top, rgba(20,16,12,.42) 0%, rgba(20,16,12,.08) 28%, transparent 55%);
    pointer-events:none;
  }
  .menu-card{
    background:rgba(59,46,32,.94);
    color:var(--paper);
    border-radius:16px;
    padding:18px 22px 20px;
    max-width:410px;
    width:min(92%,410px);
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.4), 0 4px 0 rgba(0,0,0,.2);
    position:relative;
    z-index:1;
    overflow:hidden;
    margin-bottom:4px;
    backdrop-filter:blur(2px);
  }
  .menu-card::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg, rgba(215,166,63,0.08) 0 18px, transparent 18px 36px);
    pointer-events:none;
  }
  .menu-card .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--wheat-gold);position:relative;z-index:1;
  }
  .menu-card h1{font-size:28px;color:var(--paper);margin:6px 0 14px;position:relative;z-index:1;}
  .menu-tagline{font-size:13.5px;color:#cbb98c;line-height:1.5;margin:0 0 18px;position:relative;z-index:1;}
  .menu-save-info{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--wheat-gold);
    background:rgba(215,166,63,0.12);border-radius:8px;padding:8px 12px;margin-bottom:20px;
    position:relative;z-index:1;
  }
  .menu-actions{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;}
  .menu-btn{
    font-family:'Fraunces',serif;font-weight:600;font-size:15px;
    padding:13px;border-radius:10px;cursor:pointer;border:1px solid rgba(238,227,200,0.35);
    background:rgba(238,227,200,0.1);color:var(--paper);
  }
  .menu-btn:hover{background:rgba(238,227,200,0.2);}
  .menu-btn.primary{background:var(--wheat-gold);color:var(--ink);border-color:var(--wheat-gold-deep);}
  .menu-btn.primary:hover{background:#e2b451;}

  /* ---------- TOAST ---------- */
  #toast{
    min-height:20px;
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--soil-dark);
    background:var(--wheat-gold);
    border-radius:7px;
    padding:0;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:all .25s ease;
  }
  #toast.show{padding:8px 14px;max-height:40px;opacity:1;}

  /* ---------- LAYOUT ---------- */
  .layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px;}
  @media (max-width:880px){.layout{grid-template-columns:1fr;}}

  .card{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:16px;
    box-shadow: var(--shadow);
  }
  .card > h2{
    font-size:15px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--soil);border-bottom:2px solid var(--panel-line);
    padding-bottom:8px;margin-bottom:12px;
  }
  .card > h2 .sub{
    display:block;font-family:'Inter';text-transform:none;letter-spacing:0;
    font-size:11.5px;color:#8a7a55;font-weight:400;margin-top:2px;
  }

  /* ---------- MAP ---------- */
  .paddock-map{
    background: var(--stubble);
    border-radius:10px;
    padding:14px;
    display:flex;flex-direction:column;gap:0;
    position:relative;
    border:3px solid var(--soil-dark);
  }
  .field-row{display:flex;width:100%;min-height:112px;align-items:stretch;}
  .field-row{margin-top:0;}

  .road-h{
    width:100%;height:22px;flex-shrink:0;
    background:linear-gradient(to bottom,
      var(--track-grass) 0%, var(--track-grass) 16%,
      var(--track-dirt) 16%, var(--track-dirt) 38%,
      var(--track-grass) 38%, var(--track-grass) 62%,
      var(--track-dirt) 62%, var(--track-dirt) 84%,
      var(--track-grass) 84%, var(--track-grass) 100%);
  }
  .road-v{
    width:20px;flex-shrink:0;align-self:stretch;
    background:linear-gradient(to right,
      var(--track-grass) 0%, var(--track-grass) 16%,
      var(--track-dirt) 16%, var(--track-dirt) 38%,
      var(--track-grass) 38%, var(--track-grass) 62%,
      var(--track-dirt) 62%, var(--track-dirt) 84%,
      var(--track-grass) 84%, var(--track-grass) 100%);
  }

  .field-plot{
    position:relative;
    padding:10px;
    cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;
    transition:filter .1s ease;
    min-width:70px;
  }
  .field-plot:hover{filter:brightness(1.06);}
  .field-plot.selected{outline:3px solid var(--ink);outline-offset:-3px;}

  .field-plot.state-unowned{background-color:#cabf9e;cursor:pointer;}
  .field-plot.state-harvested{background-color:var(--stubble);}
  .field-plot.state-cultivated{background-color:var(--tilled);}
  .field-plot.state-sowed{background-color:var(--sown);}
  .field-plot.state-growing1{background-color:var(--field-green-1);}
  .field-plot.state-growing2{background-color:var(--field-green-2);}
  .field-plot.state-growing3{background-color:var(--field-green-3);}
  .field-plot.state-ready{background-color:var(--wheat-gold);}
  .field-plot.state-withered{background-color:var(--withered);}
  .field-plot.state-mowed{background-color:var(--hay-mowed);}
  .field-plot.state-tedded{background-color:var(--hay-tedded);}
  .field-plot.state-windrowed{background-color:var(--hay-windrowed);}
  .field-plot.state-baled{background-color:var(--silage-baled);}

  .field-plot .ftag{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    background:rgba(255,255,255,0.75);color:var(--ink);
    padding:2px 6px;border-radius:5px;align-self:flex-start;
    font-weight:600;
  }
  .field-plot .fname{font-family:'Fraunces',serif;font-weight:600;font-size:13px;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,0.35);}
  .field-plot .fstate{font-size:10.5px;color:var(--ink);opacity:.85;}

  .map-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px;font-size:11px;}
  .map-legend span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,0.25);}

  /* ---------- BUILDINGS ROW ---------- */
  .buildings-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .building-tile{
    flex:1;min-width:130px;
    background:var(--soil);
    color:var(--paper);
    border-radius:10px;
    padding:10px 12px;
    text-align:center;
    cursor:pointer;
    border:2px solid var(--soil-dark);
  }
  .building-tile.owned{background:var(--field-green-3);}
  .building-tile .bicon{font-size:22px;display:block;margin-bottom:2px;}
  .building-tile .bname{font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;}
  .building-tile .bstatus{font-family:'IBM Plex Mono',monospace;font-size:10.5px;opacity:.85;margin-top:2px;}

  .pen-plot{background-color:#cbb383 !important;}
  .pen-plot.pen-unbuilt{background-color:#b8ab86 !important;}
  .pen-silhouette{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;opacity:0.28;pointer-events:none;}
  .pen-silhouette.barn-silhouette{opacity:0.3;}
  .barn-row{margin:2px 0;}
  .barn-svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));}
  .pen-icons{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;min-height:18px;}
  .mini-animal{font-size:14px;line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,0.2));}

  /* ---------- TABS ---------- */
  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab-btn{
    flex:1;background:var(--paper-deep);border:1px solid var(--panel-line);
    padding:8px 6px;border-radius:8px;cursor:pointer;
    font-family:'Fraunces',serif;font-weight:600;font-size:12.5px;color:var(--soil);
  }
  .tab-btn.active{background:var(--wheat-gold);color:var(--ink);border-color:var(--wheat-gold-deep);}

  /* ---------- OVERVIEW ---------- */
  .map-mode-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .map-mode-btn{
    background:var(--paper-deep);border:1px solid var(--panel-line);
    padding:7px 12px;border-radius:20px;cursor:pointer;
    font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:var(--soil);
  }
  .map-mode-btn.active{background:var(--soil-dark);color:var(--paper);border-color:var(--soil-dark);}
  .overview-table-wrap{margin-top:18px;overflow-x:auto;}
  .overview-table-wrap h4{font-size:14px;margin-bottom:8px;}
  .status-pill{
    display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;
    margin:1px 3px 1px 0;white-space:nowrap;
  }
  .status-pill.ok{background:rgba(58,125,58,0.15);color:var(--up);}
  .status-pill.warn{background:rgba(182,131,42,0.18);color:var(--wheat-gold-deep);}
  .status-pill.bad{background:rgba(163,55,46,0.15);color:var(--down);}
  .status-pill.neutral{background:rgba(90,80,60,0.12);color:#6b5a3a;}
  table.kiosk.overview-table td, table.kiosk.overview-table th{padding:7px 6px;}
  tr.ov-unowned td{opacity:.6;}

  /* ---------- FIELD PANEL ---------- */
  .field-detail h3{font-size:17px;}
  .fd-meta{display:flex;gap:14px;margin:8px 0 14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b5a3a;}
  .progress-track{display:flex;gap:3px;margin:10px 0;}
  .progress-seg{flex:1;height:8px;border-radius:3px;background:#d9cba0;}
  .progress-seg.filled{background:var(--field-green-2);}
  .action-btn{
    width:100%;background:var(--wheat-gold-deep);color:#fff;border:none;
    padding:10px;border-radius:8px;font-family:'Fraunces',serif;font-weight:600;
    font-size:14px;cursor:pointer;margin-top:8px;
  }
  .action-btn:hover{background:#a17020;}
  .action-btn:disabled{background:#b8ab86;cursor:not-allowed;}
  select.crop-select{
    width:100%;padding:9px;border-radius:8px;border:1px solid var(--panel-line);
    font-family:'Inter';font-size:13.5px;background:#fff;margin-top:8px;
  }
  .empty-hint{color:#8a7a55;font-size:13px;line-height:1.5;padding:10px 0;}

  .soil-panel{background:#fbf6e8;border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px;margin:10px 0 4px;}
  .soil-row{margin-bottom:9px;}
  .soil-row:last-child{margin-bottom:0;}
  .soil-label{display:flex;justify-content:space-between;font-size:11.5px;color:#6b5a3a;margin-bottom:4px;}
  .soil-val{font-weight:600;font-size:12px;}
  .soil-good{color:var(--up);}
  .soil-ok{color:var(--wheat-gold-deep);}
  .soil-poor{color:var(--down);}
  .gauge{position:relative;height:8px;border-radius:4px;background:#e2d3ac;overflow:hidden;}
  .gauge-fill{height:100%;border-radius:4px;transition:width .2s ease;}
  .gauge-fill.soil-good{background:var(--up);}
  .gauge-fill.soil-ok{background:var(--wheat-gold-deep);}
  .gauge-fill.soil-poor{background:var(--down);}

<script>
/* ============================= DATA ============================= */
const CROP_INFO = {
  wheat:    {label:'Wheat',     seedCost:60, yieldPerHa:2.0,  base:260, product:'flour',        emoji:'🌾'},
  barley:   {label:'Barley',    seedCost:55, yieldPerHa:1.75, base:230, product:'flour',        emoji:'🌾'},
  oats:     {label:'Oats',      seedCost:52, yieldPerHa:2.1,  base:220, product:'flour',        emoji:'🌾'},
  sorghum:  {label:'Sorghum',   seedCost:50, yieldPerHa:2.25, base:240, product:'flour',        emoji:'🌾'},
  canola:   {label:'Canola',    seedCost:75, yieldPerHa:0.9,  base:620, product:'canolaOil',    emoji:'🌼'},
  sunflower:{label:'Sunflower', seedCost:65, yieldPerHa:0.75, base:520, product:'sunflowerOil', emoji:'🌻'},
  corn:     {label:'Corn',      seedCost:65, yieldPerHa:4.5,  base:200, product:'driedCorn',    emoji:'🌽'},
  soybean:  {label:'Soybean',   seedCost:70, yieldPerHa:1.4,  base:480, product:null,           emoji:'🫘'},
  grass:    {label:'Grass',     seedCost:25, yieldPerHa:2.5,  base:0,   product:null,           emoji:'🌱'}
};
const GRAIN_CROPS = ['wheat','barley','oats','sorghum'];
const OIL_CROPS = ['canola','sunflower'];
const FEED_PRIORITY = ['wheat','barley','oats','sorghum'];
// wheat, barley & oats leave stubble behind that can be baled into straw after harvest
const STRAW_CROPS = ['wheat','barley','oats'];
const STRAW_TO_GRAIN_RATIO = 0.8; // roughly how much straw (by weight) comes off alongside the grain
const STRAW_BALE_COST_HA = 15;

// raw goods produced directly by animals (sellable as-is, not "grown")
const RAW_GOODS_INFO = {
  eggs:        {label:'Eggs',         base:2800, emoji:'🥚'},
  milk:        {label:'Milk',         base:850,  emoji:'🥛'},
  buffaloMilk: {label:'Buffalo Milk', base:9000, emoji:'🥛'},
  goatMilk:    {label:'Goat Milk',    base:9000, emoji:'🥛'},
  wool:        {label:'Wool',         base:3000, emoji:'🧶'}
};

// bales — counted individually (not by tonnage). sizeT is how many tonnes of raw
// cut/stubble go into one bale, used only to convert yields into a bale count.
const BALE_INFO = {
  grassBale:  {label:'Grass Bale',  sizeT:0.30, base:18, emoji:'🌿'},
  hayBale:    {label:'Hay Bale',    sizeT:0.25, base:22, emoji:'🟨'},
  silageBale: {label:'Silage Bale', sizeT:0.50, base:45, emoji:'🟩'},
  strawBale:  {label:'Straw Bale',  sizeT:0.20, base:12, emoji:'🌾'}
};
const BALE_KEYS = Object.keys(BALE_INFO);

// manure — produced automatically when cows (not buffalo) are fed straw bales; spread on paddocks as free fertilizer
const MANURE_PER_STRAW_T = 1.5;   // manure units produced per tonne of straw fed to cows
const MANURE_N_BOOST_PER_UNIT = 3; // % nitrogen boost per unit of manure applied

// processed goods made at a mill/bakery/dairy from raw crops or raw goods
const PRODUCT_INFO = {
  flour:             {label:'Flour',             base:480,  from:GRAIN_CROPS,     ratio:0.78, mill:'grainMill'},
  canolaOil:         {label:'Canola Oil',         base:1450, from:['canola'],      ratio:0.42, mill:'oilMill'},
  sunflowerOil:      {label:'Sunflower Oil',      base:1300, from:['sunflower'],   ratio:0.40, mill:'oilMill'},
  bread:             {label:'Bread',              base:1050, from:['flour'],       ratio:1.25, mill:'bakery'},
  cheese:            {label:'Cheese',             base:2200, from:['milk'],        ratio:0.12, mill:'dairy'},
  butter:            {label:'Butter',             base:3400, from:['milk','goatMilk'], ratio:0.05, mill:'dairy'},
  goatCheese:        {label:'Goat Cheese',        base:2600, from:['goatMilk'],    ratio:0.13, mill:'dairy'},
  buffaloMozzarella: {label:'Buffalo Mozzarella', base:6500, from:['buffaloMilk'], ratio:0.11, mill:'dairy'},
  driedCorn:         {label:'Dried Corn',         base:340,  from:['corn'],        ratio:0.85, mill:'cornDryer'}
};

const FIELD_STATE_ORDER = ['harvested','cultivated','sowed','growing1','growing2','growing3','ready'];
const STATE_LABEL = {
  harvested:'Harvested / Fallow', cultivated:'Cultivated', sowed:'Sown',
  growing1:'Growing — Early', growing2:'Growing — Mid', growing3:'Growing — Late',
  ready:'Ready to Harvest',
  withered:'Withered — Crop Lost',
  mowed:'Mowed — Choose Bale Type', tedded:'Tedded — Drying (Hay)', windrowed:'Windrowed — Ready to Bale',
  baled:'Baled — Ready to Wrap (Silage)'
};
const CULTIVATE_COST_HA = 45;
const HARVEST_COST_HA = 40;
const SPRAY_COST_HA = 25;
const SPRAY_YIELD_BONUS = 0.12; // +12% yield when weeds are sprayed out during growth
const WITHER_AFTER_READY_DAYS = 2; // crops left unharvested past this many months wither (grass is exempt)
const LIME_COST_HA = 90;
const LIME_PH_BOOST = 1.0;
const PH_CAP = 7.5;
const PH_FLOOR = 4.2;
const FERT_COST_HA = 75;
const FERT_N_BOOST = 45;
const N_CAP = 100;

const CHICKEN_PEN_PRICE = 9000;
const CHICKEN_PEN_CAPACITY = 30;
const CHICKEN_COST = 15;
const CHICKEN_FEED_PER_DAY = 0.00013; // tonnes of grain per chicken per day
// User supplied production table: ~20 L/month/chicken
const CHICKEN_L_PER_MONTH = 20;
const CHICKEN_EGG_PER_DAY = (CHICKEN_L_PER_MONTH / 30) / 1000; // stored internally as tonnes

const COW_PEN_PRICE = 254000;
const COW_PEN_CAPACITY = 200;
const COW_COST = 900;
const COW_FEED_PER_DAY = 0.030;
const COW_MILK_PER_DAY = (20 / 30) / 1000; // ~20 L/month/cow
const BUFFALO_COST = 2800;
const BUFFALO_FEED_PER_DAY = 0.032;
const BUFFALO_MILK_PER_DAY = (20 / 30) / 1000; // ~20 L/month/buffalo

const GOAT_SHEEP_PEN_PRICE = 54000;
const GOAT_SHEEP_PEN_CAPACITY = 50;
const GOAT_COST = 350;
const GOAT_FEED_PER_DAY = 0.005;
const GOAT_MILK_PER_DAY = (20 / 30) / 1000; // ~20 L/month/goat
const SHEEP_COST = 180;
const SHEEP_WOOL_PER_DAY = (60 / 30) / 1000; // ~60 L/month/sheep
const SHEEP_FEED_PER_DAY = 0.0015;

// grass & haymaking
const GRASS_SEED_COST_HA = 25;
const GRASS_YIELD_PER_HA = 2.5;
const MOW_COST_HA = 15;
const TEDD_COST_HA = 10;
const WINDROW_COST_HA = 12;
const BALE_COST_HA = 20;

// silage — same mow/tedd/windrow pass, but baled wetter then wrapped instead of dried into hay
const SILAGE_YIELD_MULTIPLIER = 1.3; // less moisture removed, so heavier per hectare than dry hay
const WRAP_COST_HA = 18;

// meadow grazing (built into the cow and goat/sheep pens) — always available, less efficient than baled hay/silage
const MEADOW_COVERAGE = 0.5;   // meadow alone can cover up to 50% of an animal's daily feed need
const MEADOW_EFFICIENCY = 0.6; // meadow-covered feed only counts for 60% as much production

// livestock resale
const LIVESTOCK_RESALE_FACTOR = 0.6; // selling an animal back returns 60% of its purchase price

// greenhouse — grows produce year-round; instead of consuming a raw crop it spends daily upkeep cash.
// Upkeep is deliberately steep (FS25-style) — you're paying for climate control, not land.
const GREENHOUSE_UPKEEP_PER_UNIT = 600; // $ spent per capacity unit per day (heating, water, labour) — doubled
const GREENHOUSE_YIELD_PER_UNIT = 0.85; // tonnes of produce per capacity unit per day at full funding, before the crop's own yield multiplier

// crops a greenhouse can be activated to grow — prices pegged to Farming Simulator 25's easy-economy
// tier for these greenhouse vegetables (tomato/lettuce are well documented; chilli/garlic are matched
// to the same tier since exact published easy-economy figures for them weren't available)
const GREENHOUSE_CROP_INFO = {
  tomatoes: {label:'Tomatoes', emoji:'🍅', base:2000, yieldMultiplier:1.00},
  lettuce:  {label:'Lettuce',  emoji:'🥬', base:2500, yieldMultiplier:0.95},
  chilli:   {label:'Chilli',   emoji:'🌶️', base:2300, yieldMultiplier:0.50},
  garlic:   {label:'Garlic',   emoji:'🧄', base:2100, yieldMultiplier:0.68}
};
const GREENHOUSE_CROP_KEYS = Object.keys(GREENHOUSE_CROP_INFO);

// small hand-drawn-style fish icons used in place of a generic fish emoji
const TROUT_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="22" height="14" style="vertical-align:-3px" aria-label="Trout"><path d="M44 12 L60 2 L58 20 L60 38 L44 28 Z" fill="#2c5c8f"/><path d="M8 20c0-10 11-16 24-16 9 0 15 4 18 8 3 3 3 3 3 3l-3 5 3 5s0 0-3 3c-3 4-9 8-18 8-13 0-24-6-24-16z" fill="#3f7fbf" stroke="#2c5c8f" stroke-width="1.5"/><path d="M18 7c3-3 8-5 13-5" fill="none" stroke="#7fb2e0" stroke-width="3" stroke-linecap="round" opacity=".7"/><path d="M14 33c3 2 7 3 11 3" fill="none" stroke="#2c5c8f" stroke-width="2" stroke-linecap="round" opacity=".5"/><circle cx="17" cy="17" r="3.4" fill="#12233a"/><circle cx="18.2" cy="15.8" r="1.1" fill="#fff"/></svg>`;
const SALMON_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 40" width="22" height="14" style="vertical-align:-3px" aria-label="Salmon"><path d="M44 12 L60 2 L58 20 L60 38 L44 28 Z" fill="#c9531f"/><path d="M8 20c0-10 11-16 24-16 9 0 15 4 18 8 3 3 3 3 3 3l-3 5 3 5s0 0-3 3c-3 4-9 8-18 8-13 0-24-6-24-16z" fill="#e8763f" stroke="#c9531f" stroke-width="1.5"/><path d="M18 7c3-3 8-5 13-5" fill="none" stroke="#f4a876" stroke-width="3" stroke-linecap="round" opacity=".7"/><path d="M14 33c3 2 7 3 11 3" fill="none" stroke="#c9531f" stroke-width="2" stroke-linecap="round" opacity=".5"/><circle cx="17" cy="17" r="3.4" fill="#3a1608"/><circle cx="18.2" cy="15.8" r="1.1" fill="#fff"/></svg>`;
const FISH_LOGO_ICON = `<span style="display:inline-flex;align-items:center;gap:2px">${TROUT_ICON}${SALMON_ICON}</span>`;

// buildings that sit off to the side (not tied to a paddock)
const BUILDINGS_INFO = {
  grainMill:  {label:'Grain Mill', price:120000, capacity:6, icon:'⚙️', desc:'Wheat, Barley &amp; Sorghum → Flour'},
  oilMill:    {label:'Oil Mill',   price:80000,  capacity:4, icon:'🛢️', desc:'Canola &amp; Sunflower → Oil'},
  bakery:     {label:'Bakery',     price:50000,  capacity:5, icon:'🍞', desc:'Flour → Bread'},
  dairy:      {label:'Dairy',      price:210000, capacity:6, icon:'🥛', desc:'Milk, Goat Milk &amp; Buffalo Milk → Cheese, Butter, Goat Cheese &amp; Buffalo Mozzarella'},
  cornDryer:      {label:'Corn Dryer',       price:45000,  capacity:8, icon:'🌽', desc:'Corn → Dried Corn (1.7× the raw corn price)'},
  greenhouseSmall:{label:'Greenhouse (Small)', price:18000, capacity:1, icon:'🍅', desc:'Grows Tomatoes, Lettuce, Chilli or Garlic year-round — a cheap starter greenhouse, spends daily upkeep cash instead of consuming a crop'},
  greenhouse:     {label:'Greenhouse (Large)', price:60000, capacity:4, icon:'🍅', desc:'Grows Tomatoes, Lettuce, Chilli or Garlic year-round — spends daily upkeep cash instead of consuming a crop'},
  fishBreeding: {label:'Young Fish Breeding', price:95000, capacity:2, icon:FISH_LOGO_ICON, desc:'Breeds young Trout and Salmon. Choose one or both species to activate.'},
  fishFarm: {label:'Fish Farm', price:125000, capacity:2, icon:FISH_LOGO_ICON, desc:'Raises young Trout and Salmon into larger fish that sell for more.'}
};
const GREENHOUSE_KEYS = ['greenhouseSmall','greenhouse'];

// Monthly operating costs for production facilities. Greenhouses are intentionally excluded.
const PRODUCTION_MONTHLY_COSTS = {
  grainMill:4500, oilMill:4000, bakery:3000, dairy:7000, cornDryer:2500,
  chickenProduction:500, cowProduction:3500, goatSheepProduction:1500,
  fishBreeding:4000, fishFarm:6000
};

const FISH_INFO = {
  youngTrout:{label:'Young Trout', emoji:TROUT_ICON, base:5000, species:'trout', type:'young'},
  youngSalmon:{label:'Young Salmon', emoji:SALMON_ICON, base:6500, species:'salmon', type:'young'},
  trout:{label:'Trout', emoji:TROUT_ICON, base:9000, species:'trout', type:'adult'},
  salmon:{label:'Salmon', emoji:SALMON_ICON, base:11000, species:'salmon', type:'adult'}
};
const FISH_KEYS = Object.keys(FISH_INFO);
const FISH_BREEDING_PRICE = 95000;
const FISH_FARM_PRICE = 125000;
const FISH_BREEDING_MONTHLY_OUTPUT = 1.5; // tonnes (1,500 L) per activated species
const FISH_FARM_INPUT_PER_SPECIES = 1.0; // tonnes young fish/month per activated species
const FISH_FARM_OUTPUT_RATIO = 0.8;

function ownedFarmHa(){ return state.fields.filter(f=>f.owned).reduce((sum,f)=>sum+Number(f.size||0),0); }
function fishFoodCost(key){
  const sizeFactor = 1 + (ownedFarmHa()/100)*0.25;
  return Math.round(PRODUCTION_MONTHLY_COSTS[key] * sizeFactor);
}

const PRODUCTION_OPTIONS = {
  grainMill:GRAIN_CROPS.map(k=>({key:k,label:CROP_INFO[k].label,emoji:CROP_INFO[k].emoji})),
  oilMill:OIL_CROPS.map(k=>({key:k,label:CROP_INFO[k].label,emoji:CROP_INFO[k].emoji})),
  bakery:[{key:'bread',label:'Bread',emoji:'🍞'}],

function activeList(key, fallback){
  const b = state.buildings[key];
  if(!b) return fallback.slice();
  if(!Array.isArray(b.activeProducts)) b.activeProducts = fallback.slice();
  return b.activeProducts;
}
function setProductionActive(key, product, checked){
  const b=state.buildings[key]; if(!b) return;
  const opts=PRODUCTION_OPTIONS[key]||[];
  if(!Array.isArray(b.activeProducts)) b.activeProducts=opts.map(o=>o.key);
  if(checked && !b.activeProducts.includes(product)) b.activeProducts.push(product);
  if(!checked) b.activeProducts=b.activeProducts.filter(k=>k!==product);
  saveGame(); render();
}
function productionOptionsHtml(key){
  const opts=PRODUCTION_OPTIONS[key]||[];
  const active=activeList(key,opts.map(o=>o.key));
  if(opts.length<2) return opts.length ? `<div class="production-options">${opts.map(o=>`<label class="production-option"><input type="checkbox" ${active.includes(o.key)?'checked':''} onchange="setProductionActive('${key}','${o.key}',this.checked)"> ${o.emoji} ${o.label}</label>`).join('')}</div>` : '';
  return `<div class="production-options">${opts.map(o=>`<label class="production-option"><input type="checkbox" ${active.includes(o.key)?'checked':''} onchange="setProductionActive('${key}','${o.key}',this.checked)"> ${o.emoji} ${o.label}</label>`).join('')}</div>`;
}

function recordFinance(type, category, amount, note){
  if(!state.finances) state.finances={history:[]};
  const a=Number(amount)||0;
  if(!a) return;
  state.finances.history.unshift({day:state.day,type,category,amount:a,note});
  if(state.finances.history.length>250) state.finances.history.length=250;
}
function monthFinanceTotals(day){
  const h=(state.finances&&state.finances.history)||[];
  const rows=h.filter(r=>r.day===day);
  return {income:rows.filter(r=>r.type==='income').reduce((a,r)=>a+r.amount,0),expense:rows.filter(r=>r.type==='expense').reduce((a,r)=>a+r.amount,0),rows};
}

async function saveGame(){
  try{
    await window.storage.set('munyara-downs-save', JSON.stringify(state), false);
  }catch(e){ /* best effort, ignore */ }
}
async function loadGame(){
  try{
    const res = await window.storage.get('munyara-downs-save', false);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      state = Object.assign(defaultState(), loaded);
      // migrate saves from earlier versions
      if(!state.pens) state.pens = {chickenPen:{owned:false,chickenCount:0}, cowPen:{owned:false,cows:0,buffaloCows:0}, goatSheepPen:{owned:false,goats:0,sheep:0}};
      state.pens.chickenPen.owned = !!state.pens.chickenPen.owned;
      state.pens.cowPen.owned = !!state.pens.cowPen.owned;
      state.pens.goatSheepPen.owned = !!state.pens.goatSheepPen.owned;
      if(!state.animalProduction) state.animalProduction = {
        chickenProduction:{owned:false},
        cowProduction:{owned:false},
        goatSheepProduction:{owned:false}
      };
      // Migrate old paddock pens to off-field production facilities.
      state.animalProduction.chickenProduction.owned = !!state.pens.chickenPen?.owned;
      state.animalProduction.cowProduction.owned = !!state.pens.cowPen?.owned;
      state.animalProduction.goatSheepProduction.owned = !!state.pens.goatSheepPen?.owned;
      state.fields.forEach(f=>{ delete f.penType; });
      if(state.buildings.chickenPen){ // very old save had the pen under buildings
        state.pens.chickenPen = state.buildings.chickenPen;
        delete state.buildings.chickenPen;
      }
      if(!state.buildings.dairy) state.buildings.dairy = {owned:false, auto:true};
      if(!state.buildings.cornDryer) state.buildings.cornDryer = {owned:false, auto:true};
      if(!state.buildings.greenhouse) state.buildings.greenhouse = {owned:false, auto:true};
      if(!state.buildings.greenhouseSmall) state.buildings.greenhouseSmall = {owned:false, auto:true};
      if(!state.buildings.fishBreeding) state.buildings.fishBreeding = {owned:false, auto:true, activeProducts:['trout','salmon']};
      if(!state.buildings.fishFarm) state.buildings.fishFarm = {owned:false, auto:true, activeProducts:['trout','salmon']};
      if(!Array.isArray(state.buildings.fishBreeding.activeProducts)) state.buildings.fishBreeding.activeProducts=['trout','salmon'];
      if(!Array.isArray(state.buildings.fishFarm.activeProducts)) state.buildings.fishFarm.activeProducts=['trout','salmon'];
      ['fishBreeding','fishFarm'].forEach(k=>{ if(state.capacityUsed[k]===undefined) state.capacityUsed[k]=0; if(state.lastProcessed[k]===undefined) state.lastProcessed[k]=null; });
      if(!state.finances) state.finances={history:[]};
      const fishInvDefaults={youngTrout:0,youngSalmon:0,trout:0,salmon:0};
      Object.keys(fishInvDefaults).forEach(k=>{if(state.inventory[k]===undefined) state.inventory[k]=0;});
      const fishPriceDefaults={youngTrout:5000,youngSalmon:6500,trout:9000,salmon:11000};
      Object.keys(fishPriceDefaults).forEach(k=>{if(state.prices[k]===undefined) state.prices[k]=fishPriceDefaults[k]; if(state.prevPrices[k]===undefined) state.prevPrices[k]=fishPriceDefaults[k];});
      ['grainMill','oilMill','bakery','dairy','cornDryer','greenhouse','greenhouseSmall'].forEach(k=>{ if(state.buildings[k].auto===undefined) state.buildings[k].auto = true; });
      const invDefaults = {eggs:0, milk:0, buffaloMilk:0, goatMilk:0, wool:0, hayBale:0, silageBale:0, tomatoes:0, cheese:0, butter:0, goatCheese:0, buffaloMozzarella:0, youngTrout:0, youngSalmon:0, trout:0, salmon:0, corn:0, soybean:0, driedCorn:0};
      Object.keys(invDefaults).forEach(k=>{ if(state.inventory[k]===undefined) state.inventory[k]=invDefaults[k]; });
      const priceDefaults = {eggs:2800, milk:650, buffaloMilk:1900, goatMilk:900, wool:4500, hayBale:90, silageBale:300, tomatoes:900, cheese:2200, butter:3400, goatCheese:2600, buffaloMozzarella:6500, youngTrout:5000, youngSalmon:6500, trout:9000, salmon:11000, corn:200, soybean:480, driedCorn:340};

      if(state.capacityUsed.greenhouse===undefined) state.capacityUsed.greenhouse = 0;

      if(!state.fields.some(f=>f.id===20)){
        state.fields.push({id:20, size:120, price:510000, owned:false, state:'harvested', crop:null, ph:6.0, nitrogen:50, displayNumber:17});
      }

      state.fields = state.fields.filter(f=>![16,17,18].includes(f.id));
      state.fields.forEach(f=>{ delete f.penType; });

      if(state.prices.strawBale===undefined){ state.prices.strawBale = BALE_INFO.strawBale.base; state.prevPrices.strawBale = BALE_INFO.strawBale.base; }
      if(!state._baleMigration){
        // older saves stored hay/silage by tonnage at per-tonne prices — reset to per-bale pricing,
        // and roughly carry over existing stock as a bale count
        state.inventory.hayBale = Math.round(state.inventory.hayBale||0);
        state.inventory.silageBale = Math.round(state.inventory.silageBale||0);
        state.prices.hayBale = BALE_INFO.hayBale.base; state.prevPrices.hayBale = BALE_INFO.hayBale.base;
        state.prices.silageBale = BALE_INFO.silageBale.base; state.prevPrices.silageBale = BALE_INFO.silageBale.base;
        state._baleMigration = true;
      }
      if(!state._priceMigration2){
        // milk/wool prices rebased to match current market reference points
        state.prices.milk = RAW_GOODS_INFO.milk.base; state.prevPrices.milk = RAW_GOODS_INFO.milk.base;
        state.prices.goatMilk = RAW_GOODS_INFO.goatMilk.base; state.prevPrices.goatMilk = RAW_GOODS_INFO.goatMilk.base;
        state.prices.buffaloMilk = RAW_GOODS_INFO.buffaloMilk.base; state.prevPrices.buffaloMilk = RAW_GOODS_INFO.buffaloMilk.base;
        state.prices.wool = RAW_GOODS_INFO.wool.base; state.prevPrices.wool = RAW_GOODS_INFO.wool.base;
        state._priceMigration2 = true;
      }
      state.fields.forEach(f=>{
        if(f.strawAvailable===undefined) f.strawAvailable = false;
        if(f.strawPotential===undefined) f.strawPotential = 0;
        if(f.baleType===undefined) f.baleType = null;
      });

      // --- greenhouse crop selection + repriced produce migration ---
      ['greenhouse','greenhouseSmall'].forEach(k=>{
        if(state.buildings[k] && state.buildings[k].activeCrop===undefined) state.buildings[k].activeCrop = 'tomatoes';
      });
      if(state.inventory.lettuce===undefined) state.inventory.lettuce = 0;
      if(state.inventory.chilli===undefined) state.inventory.chilli = 0;
      if(state.inventory.garlic===undefined) state.inventory.garlic = 0;
      if(!state._greenhouseMigration){
        // tomatoes are repriced to match the new FS25-tier produce lineup
        state.prices.tomatoes = GREENHOUSE_CROP_INFO.tomatoes.base;
        state.prevPrices.tomatoes = GREENHOUSE_CROP_INFO.tomatoes.base;
        state._greenhouseMigration = true;

      GREENHOUSE_CROP_KEYS.forEach(k=>{
        if(state.prices[k]===undefined){ state.prices[k] = GREENHOUSE_CROP_INFO[k].base; state.prevPrices[k] = GREENHOUSE_CROP_INFO[k].base; }
      });

      state.toastMsg='';
      hasSave = true;
    }
  }catch(e){ /* no save yet, ignore */ }
  render();
}

/* ============================= HELPERS ============================= */
function money(n){ return '$' + Math.round(n).toLocaleString(); }
// look up a field by its `id` property — the fields array is NOT guaranteed
// to have array-index === id (paddocks can be removed from the middle), so
// this must never be replaced with state.fields[id]
function getField(id){ return state.fields.find(f=>f.id===id); }
// the number shown to the player — normally id+1, but overridable per field
// (e.g. the 120ha paddock displays as 17 even though its internal id is 20)
function paddockLabel(f){ return f.displayNumber || (f.id+1); }
function tonnes(n){
  // Internal quantities remain in tonnes for calculations; UI displays litres.
  const litres = Number(n || 0) * 1000;
  return litres.toLocaleString(undefined,{maximumFractionDigits:1}) + ' L';
}
function litres(n){ return tonnes(n); }
function toast(msg){ state.toastMsg = msg; render(); setTimeout(()=>{ state.toastMsg=''; renderToastOnly(); }, 3200); }

function phFactor(ph){
  const f = 1.1 - Math.abs(ph-6.5)*0.25;
  return Math.max(0.5, Math.min(1.1, f));
}
function nFactor(n){
  const f = 0.55 + Math.min(n,100)/100*0.55;
  return Math.max(0.55, Math.min(1.1, f));
}
function yieldOutlook(f){
  return Math.round(phFactor(f.ph) * nFactor(f.nitrogen) * 100);
}
function soilTier(pct){
  if(pct>=90) return 'good';
  if(pct>=65) return 'ok';
  return 'poor';
}

function allBuildingKeysFor(itemKey){
  // which building processes this raw item
  if(GRAIN_CROPS.includes(itemKey)) return 'grainMill';
  if(OIL_CROPS.includes(itemKey)) return 'oilMill';
  if(itemKey==='flour') return 'bakery';
  return null;
}

/* ============================= ACTIONS ============================= */
function buyField(id){
  const f = getField(id);
  if(f.owned) return;
  if(state.money < f.price){ toast("Not enough cash to buy that paddock."); return; }
  state.money -= f.price;
  f.owned = true;
  f.ph = Math.round((5.7 + Math.random()*0.8)*10)/10;
  f.nitrogen = Math.round(40 + Math.random()*20);
  state.selectedField = id;
  state.activeTab='field';
  recordFinance('expense','Land purchase',f.price,`Purchased ${f.size} ha paddock ${paddockLabel ? paddockLabel(f) : f.displayNumber||id}`);
  toast(`Purchased ${f.size} ha paddock for ${money(f.price)}. Soil test: pH ${f.ph}, N ${f.nitrogen}%.`);
  saveGame(); render();
}

function cultivateField(id){
  const f = getField(id);
  if(!f.owned || (f.state!=='harvested' && f.state!=='withered')) return;
  const wasWithered = f.state==='withered';
  const cost = Math.round(CULTIVATE_COST_HA * f.size);
  if(state.money < cost){ toast("Not enough cash to cultivate."); return; }
  state.money -= cost;
  f.state = 'cultivated';
  f.crop = null;
  f.readyDays = 0;
  f.strawAvailable = false;
  f.strawPotential = 0;
  toast(wasWithered ? `Cleared the withered crop and cultivated ${f.size} ha for ${money(cost)}.` : `Cultivated ${f.size} ha for ${money(cost)}.`);
  saveGame(); render();
}

function applyLime(id){
  const f = getField(id);
  if(!f.owned) return;
  const actualBoost = Math.max(0, Math.min(LIME_PH_BOOST, PH_CAP - f.ph));
  if(actualBoost <= 0.01){ toast("Soil pH is already at target — no lime needed."); return; }
  const cost = Math.round(LIME_COST_HA * f.size * (actualBoost/LIME_PH_BOOST));
  if(state.money < cost){ toast("Not enough cash for lime."); return; }
  state.money -= cost;
  f.ph = Math.round(Math.min(PH_CAP, f.ph + actualBoost)*100)/100;
  toast(`Spread lime on ${f.size} ha for ${money(cost)} (pH +${actualBoost.toFixed(2)}). Soil pH now ${f.ph}.`);
  saveGame(); render();
}

function applyFertilizer(id){
  const f = getField(id);
  if(!f.owned) return;
  const actualBoost = Math.max(0, Math.min(FERT_N_BOOST, N_CAP - f.nitrogen));
  if(actualBoost <= 0.5){ toast("Nitrogen is already at target — no fertilizer needed."); return; }
  const cost = Math.round(FERT_COST_HA * f.size * (actualBoost/FERT_N_BOOST));
  if(state.money < cost){ toast("Not enough cash for fertilizer."); return; }
  state.money -= cost;
  f.nitrogen = Math.round(Math.min(N_CAP, f.nitrogen + actualBoost));
  toast(`Applied nitrogen fertilizer on ${f.size} ha for ${money(cost)} (N +${Math.round(actualBoost)}%). Soil N now ${f.nitrogen}%.`);
  saveGame(); render();
}

function sowField(id){
  const f = getField(id);
  if(!f.owned || f.state!=='cultivated') return;
  const cropKey = state.pendingCrop[id] || 'wheat';
  const info = CROP_INFO[cropKey];
  const cost = Math.round(info.seedCost * f.size);
  if(state.money < cost){ toast("Not enough cash for seed."); return; }
  state.money -= cost;
  f.state = 'sowed';
  f.crop = cropKey;
  f.sprayed = false;
  toast(`Sowed ${info.label} on ${f.size} ha for ${money(cost)}.`);
  saveGame(); render();
}

function sprayField(id){
  const f = getField(id);
  if(!f.owned) return;
  if(!['growing1','growing2','growing3'].includes(f.state)) return;
  if(f.sprayed){ toast("Already sprayed this cycle."); return; }
  const cost = Math.round(SPRAY_COST_HA * f.size);
  if(state.money < cost){ toast("Not enough cash to spray."); return; }
  state.money -= cost;
  f.sprayed = true;
  toast(`Sprayed ${f.size} ha for weeds for ${money(cost)} — expect a better yield.`);
  saveGame(); render();
}

function harvestField(id){
  const f = getField(id);
  if(!f.owned || f.state!=='ready' || f.crop==='grass') return;
  const cost = Math.round(HARVEST_COST_HA * f.size);
  if(state.money < cost){ toast("Not enough cash to run the header."); return; }
  const info = CROP_INFO[f.crop];
  const variance = 0.95 + Math.random()*0.1;
  const quality = phFactor(f.ph) * nFactor(f.nitrogen);
  const sprayBonus = f.sprayed ? (1+SPRAY_YIELD_BONUS) : 1;
  const yieldT = f.size * info.yieldPerHa * quality * variance * sprayBonus;
  state.money -= cost;
  state.inventory[f.crop] += yieldT;
  state.harvestLog.unshift({
    day: state.day, fieldId: id, size: f.size, crop: f.crop,
    yieldT: yieldT, ph: f.ph, nitrogen: f.nitrogen, quality: Math.round(quality*100)
  });
  if(state.harvestLog.length > 60) state.harvestLog.length = 60;
  f.nitrogen = Math.max(0, Math.round(f.nitrogen - 15));
  let strawMsg = '';
  if(STRAW_CROPS.includes(f.crop)){
    f.strawAvailable = true;
    f.strawPotential = yieldT * STRAW_TO_GRAIN_RATIO;
    strawMsg = ` Stubble is left behind — bale it for straw, or cultivate it straight back into the soil.`;
  } else {
    f.strawAvailable = false;
    f.strawPotential = 0;
  }
  toast(`Harvested ${tonnes(yieldT)} of ${info.label}${f.sprayed?' (weeds sprayed — yield boosted)':''} (soil quality ${Math.round(quality*100)}%).${strawMsg}`);
  f.state='harvested';
  f.crop=null;
  f.readyDays=0;
  f.sprayed=false;
  saveGame(); render();
}

function baleStraw(id){
  const f = getField(id);
  if(!f.owned || f.state!=='harvested' || !f.strawAvailable) return;
  const cost = Math.round(STRAW_BALE_COST_HA * f.size);
  if(state.money < cost){ toast("Not enough cash to bale straw."); return; }
  state.money -= cost;
  const bales = Math.max(0, Math.round((f.strawPotential||0) / BALE_INFO.strawBale.sizeT));
  state.inventory.strawBale += bales;
  f.strawAvailable = false;
  f.strawPotential = 0;
  toast(`Baled ${bales} straw bale${bales!==1?'s':''} for ${money(cost)}.`);
  saveGame(); render();
}

function mowField(id){
  const f = getField(id);
  if(!f.owned || f.state!=='ready' || f.crop!=='grass') return;
  const cost = Math.round(MOW_COST_HA * f.size);
  if(state.money < cost){ toast("Not enough cash to mow."); return; }
  state.money -= cost;
  const quality = phFactor(f.ph) * nFactor(f.nitrogen);
  const variance = 0.95 + Math.random()*0.1;
  const sprayBonus = f.sprayed ? (1+SPRAY_YIELD_BONUS) : 1;
  f.hayYield = f.size * GRASS_YIELD_PER_HA * quality * variance * sprayBonus;
  f.nitrogen = Math.max(0, Math.round(f.nitrogen - 15));
  f.state = 'mowed';
  f.sprayed = false;
  toast(`Mowed ${f.size} ha of grass for ${money(cost)}.`);
  saveGame(); render();
}

// From 'mowed', the player chooses which bale type to make:
//   Grass Bale  — Mow → Windrow → Bale
//   Hay Bale    — Mow → Tedd → Windrow → Bale
//   Silage Bale — Mow → Windrow → Bale → Wrap
function chooseBaleType(id, type){
  const f = getField(id);
  if(!f.owned || f.state!=='mowed') return;
  if(!['grass','hay','silage'].includes(type)) return;
  let cost, nextState;
  if(type==='hay'){
    cost = Math.round(TEDD_COST_HA * f.size);
    nextState = 'tedded';
  } else {
    cost = Math.round(WINDROW_COST_HA * f.size);
    nextState = 'windrowed';
  }
  if(state.money < cost){ toast("Not enough cash for that step."); return; }
  state.money -= cost;
  f.baleType = type;
  f.state = nextState;
  const label = type==='grass' ? 'a grass bale' : type==='hay' ? 'hay' : 'silage';
  toast(`Started making ${label} on ${f.size} ha for ${money(cost)}.`);
  saveGame(); render();
}

// hay only: tedded -> windrowed
function continueToWindrow(id){
  const f = getField(id);
  if(!f.owned || f.state!=='tedded' || f.baleType!=='hay') return;
  const cost = Math.round(WINDROW_COST_HA * f.size);
  if(state.money < cost){ toast("Not enough cash to windrow."); return; }
  state.money -= cost;
  f.state = 'windrowed';
  toast(`Windrowed ${f.size} ha for ${money(cost)}.`);
  saveGame(); render();
}

// from 'windrowed': grass/hay finish here as bales; silage moves to 'baled' awaiting wrap
function baleField(id){
  const f = getField(id);
  if(!f.owned || f.state!=='windrowed') return;
  const cost = Math.round(BALE_COST_HA * f.size);
  if(state.money < cost){ toast("Not enough cash to bale."); return; }
  state.money -= cost;
  if(f.baleType==='silage'){
    f.silageYield = (f.hayYield || 0) * SILAGE_YIELD_MULTIPLIER;
    f.state = 'baled';
    toast(`Baled ${f.size} ha for silage for ${money(cost)}. Wrap it to finish the fermentation.`);
    saveGame(); render();
    return;
  }
  const key = f.baleType==='grass' ? 'grassBale' : 'hayBale';
  const yieldT = f.hayYield || 0;
  const bales = Math.max(0, Math.round(yieldT / BALE_INFO[key].sizeT));
  state.inventory[key] += bales;
  state.harvestLog.unshift({
    day: state.day, fieldId: id, size: f.size, crop: 'grass',
    yieldT: yieldT, ph: f.ph, nitrogen: f.nitrogen, quality: Math.round(phFactor(f.ph)*nFactor(f.nitrogen)*100), bales, baleKind:key
  });
  if(state.harvestLog.length > 60) state.harvestLog.length = 60;
  toast(`Baled ${bales} ${BALE_INFO[key].label}${bales!==1?'s':''} for ${money(cost)}.`);
  f.state = 'harvested';
  f.crop = null;
  f.hayYield = 0;
  f.baleType = null;
  saveGame(); render();
}

// silage only: baled -> wrapped
function wrapField(id){
  const f = getField(id);
  if(!f.owned || f.state!=='baled') return;
  const cost = Math.round(WRAP_COST_HA * f.size);
  if(state.money < cost){ toast("Not enough cash to wrap."); return; }
  state.money -= cost;
  const yieldT = f.silageYield || 0;
  const bales = Math.max(0, Math.round(yieldT / BALE_INFO.silageBale.sizeT));
  state.inventory.silageBale += bales;
  state.harvestLog.unshift({
    day: state.day, fieldId: id, size: f.size, crop: 'grass',
    yieldT: yieldT, ph: f.ph, nitrogen: f.nitrogen, quality: Math.round(phFactor(f.ph)*nFactor(f.nitrogen)*100), bales, baleKind:'silageBale'
  });
  if(state.harvestLog.length > 60) state.harvestLog.length = 60;
  toast(`Wrapped ${bales} silage bale${bales!==1?'s':''} for ${money(cost)}.`);
  f.state = 'harvested';
  f.crop = null;
  f.hayYield = 0;
  f.silageYield = 0;
  f.baleType = null;
  saveGame(); render();
}

function consumeFeed(amountNeeded){
  let remaining = amountNeeded;
  const consumed = {};
  FEED_PRIORITY.forEach(crop=>{
    if(remaining<=0) return;
    const amt = Math.min(remaining, state.inventory[crop]);
    if(amt>0){
      state.inventory[crop] -= amt;
      consumed[crop] = (consumed[crop]||0) + amt;
      remaining -= amt;
    }
  });
  const fed = amountNeeded - remaining;
  return {fed, consumed, feedFactor: amountNeeded>0 ? fed/amountNeeded : 0};
}

// Cattle (cows & buffalo) can eat grass, hay, silage & straw bales — in that order of
// preference (silage highest quality, straw lowest) — then fall back to meadow grazing.
// Feeding straw to a COW (not buffalo) also produces manure, usable as free fertilizer.
function consumeCattleFeed(amountNeeded, producesManure){
  let remaining = amountNeeded;
  const used = {};
  ['silageBale','hayBale','grassBale','strawBale'].forEach(baleKey=>{
    if(remaining<=0) return;
    const sizeT = BALE_INFO[baleKey].sizeT;
    const availableT = state.inventory[baleKey] * sizeT;
    const takeT = Math.min(remaining, availableT);
    if(takeT>0){
      const balesUsed = takeT / sizeT;
      state.inventory[baleKey] -= balesUsed;
      used[baleKey] = (used[baleKey]||0) + takeT;
      remaining -= takeT;
    }
  });
  const realFed = amountNeeded - remaining;
  const meadowCap = amountNeeded * MEADOW_COVERAGE;
  const meadowUsed = Math.min(remaining, meadowCap);
  const effectiveFeed = realFed + meadowUsed * MEADOW_EFFICIENCY;
  const feedFactor = amountNeeded>0 ? Math.min(1, effectiveFeed/amountNeeded) : 0;
  const strawT = used.strawBale || 0;
  let manureProduced = 0;
  if(producesManure && strawT>0){
    manureProduced = strawT * MANURE_PER_STRAW_T;
    state.manure = Math.round((state.manure + manureProduced)*100)/100;
  }
  return {used, meadowUsed, fed:realFed, feedFactor, needed:amountNeeded, manureProduced};
}

// Sheep & goats are restricted to grass or hay bales only — no silage, straw, or grain —
// then fall back to meadow grazing like cattle.
function consumeSheepGoatFeed(amountNeeded){
  let remaining = amountNeeded;
  const used = {};
  ['hayBale','grassBale'].forEach(baleKey=>{
    if(remaining<=0) return;
    const sizeT = BALE_INFO[baleKey].sizeT;
    const availableT = state.inventory[baleKey] * sizeT;
    const takeT = Math.min(remaining, availableT);
    if(takeT>0){
      const balesUsed = takeT / sizeT;
      state.inventory[baleKey] -= balesUsed;
      used[baleKey] = (used[baleKey]||0) + takeT;
      remaining -= takeT;
    }
  });
  const realFed = amountNeeded - remaining;
  const meadowCap = amountNeeded * MEADOW_COVERAGE;
  const meadowUsed = Math.min(remaining, meadowCap);
  const effectiveFeed = realFed + meadowUsed * MEADOW_EFFICIENCY;
  const feedFactor = amountNeeded>0 ? Math.min(1, effectiveFeed/amountNeeded) : 0;
  return {used, meadowUsed, fed:realFed, feedFactor, needed:amountNeeded};
}

function applyManure(id){
  const f = getField(id);
  if(!f.owned) return;
  if(state.manure<=0){ toast("No manure available — feed straw to your cows to produce some."); return; }
  const neededBoost = N_CAP - f.nitrogen;
  if(neededBoost<=0.5){ toast("Nitrogen is already at target — no manure needed."); return; }
  const maxBoostFromStock = state.manure * MANURE_N_BOOST_PER_UNIT;
  const actualBoost = Math.min(neededBoost, maxBoostFromStock);
  const unitsUsed = actualBoost / MANURE_N_BOOST_PER_UNIT;
  state.manure = Math.round((state.manure - unitsUsed)*100)/100;
  f.nitrogen = Math.round(Math.min(N_CAP, f.nitrogen + actualBoost));
  toast(`Spread ${unitsUsed.toFixed(2)} units of manure on ${f.size} ha (N +${Math.round(actualBoost)}%). Soil N now ${f.nitrogen}%.`);
  saveGame(); render();
}

function autoProcessAll(){
  const summary = {};

  if(state.buildings.grainMill.owned && state.buildings.grainMill.auto){
    let remaining = BUILDINGS_INFO.grainMill.capacity;
    const consumed = {}; let produced = 0;
    const active=activeList('grainMill',GRAIN_CROPS);
    GRAIN_CROPS.forEach(crop=>{
      if(!active.includes(crop)) return;
      if(remaining<=0) return;
      const amt = Math.min(remaining, state.inventory[crop]);
      if(amt>0){
        state.inventory[crop] -= amt;
        const out = amt * PRODUCT_INFO.flour.ratio;
        state.inventory.flour += out;
        consumed[crop] = amt;
        produced += out;
        remaining -= amt;
      }
    });
    state.capacityUsed.grainMill = BUILDINGS_INFO.grainMill.capacity - remaining;
    summary.grainMill = {consumed, produced};
  }

  if(state.buildings.oilMill.owned && state.buildings.oilMill.auto){
    let remaining = BUILDINGS_INFO.oilMill.capacity;
    const consumed = {}; const produced = {canolaOil:0, sunflowerOil:0};
    const active=activeList('oilMill',OIL_CROPS);
    OIL_CROPS.forEach(crop=>{
      if(!active.includes(crop)) return;
      if(remaining<=0) return;
      const amt = Math.min(remaining, state.inventory[crop]);
      if(amt>0){
        state.inventory[crop] -= amt;
        const productKey = CROP_INFO[crop].product;
        const out = amt * PRODUCT_INFO[productKey].ratio;
        state.inventory[productKey] += out;
        consumed[crop] = amt;
        produced[productKey] += out;
        remaining -= amt;
      }
    });
    state.capacityUsed.oilMill = BUILDINGS_INFO.oilMill.capacity - remaining;
    summary.oilMill = {consumed, produced};
  }

  if(state.buildings.bakery.owned && state.buildings.bakery.auto && activeList('bakery',['bread']).includes('bread')){
    const amt = Math.min(BUILDINGS_INFO.bakery.capacity, state.inventory.flour);
    const out = amt * PRODUCT_INFO.bread.ratio;
    if(amt>0){ state.inventory.flour -= amt; state.inventory.bread += out; }
    state.capacityUsed.bakery = amt;
    summary.bakery = {consumed:amt, produced:out};
  }

  // Chicken pen — eggs
  const cp = state.pens.chickenPen;
  if(cp.owned && cp.chickenCount>0){
    const needed = cp.chickenCount * CHICKEN_FEED_PER_DAY;
    const r = consumeFeed(needed);
    const eggsOut = cp.chickenCount * CHICKEN_EGG_PER_DAY * r.feedFactor;
    state.inventory.eggs += eggsOut;
    summary.chickenPen = {needed, fed:r.fed, consumed:r.consumed, eggsOut, feedFactor:r.feedFactor};
  }

  // Cow pen — regular + buffalo milk. Cattle eat silage, hay, grass or straw bales (then meadow).
  // Only regular cows (not buffalo) produce manure, and only when fed straw.
  const cowPen = state.pens.cowPen;
  if(cowPen.owned){
    const cowSummary = {};
    if(cowPen.cows>0){
      const needed = cowPen.cows * COW_FEED_PER_DAY;
      const r = consumeCattleFeed(needed, true);
      const milkOut = cowPen.cows * COW_MILK_PER_DAY * r.feedFactor;
      state.inventory.milk += milkOut;
      cowSummary.regular = {needed, fed:r.fed, used:r.used, meadowUsed:r.meadowUsed, milkOut, feedFactor:r.feedFactor, manureProduced:r.manureProduced};
    }
    if(cowPen.buffaloCows>0){
      const needed = cowPen.buffaloCows * BUFFALO_FEED_PER_DAY;
      const r = consumeCattleFeed(needed, false);
      const milkOut = cowPen.buffaloCows * BUFFALO_MILK_PER_DAY * r.feedFactor;
      state.inventory.buffaloMilk += milkOut;
      cowSummary.buffalo = {needed, fed:r.fed, used:r.used, meadowUsed:r.meadowUsed, milkOut, feedFactor:r.feedFactor};
    }
    summary.cowPen = cowSummary;
  }

  // Goat & sheep pen — goat milk + wool. Sheep and goats can only eat hay or grass bales (then meadow).
  const gsPen = state.pens.goatSheepPen;
  if(gsPen.owned){
    const gsSummary = {};
    if(gsPen.goats>0){
      const needed = gsPen.goats * GOAT_FEED_PER_DAY;
      const r = consumeSheepGoatFeed(needed);
      const milkOut = gsPen.goats * GOAT_MILK_PER_DAY * r.feedFactor;
      state.inventory.goatMilk += milkOut;
      gsSummary.goats = {needed, fed:r.fed, used:r.used, meadowUsed:r.meadowUsed, milkOut, feedFactor:r.feedFactor};
    }
    if(gsPen.sheep>0){
      const needed = gsPen.sheep * SHEEP_FEED_PER_DAY;
      const r = consumeSheepGoatFeed(needed);
      const woolOut = gsPen.sheep * SHEEP_WOOL_PER_DAY * r.feedFactor;
      state.inventory.wool += woolOut;
      gsSummary.sheep = {needed, fed:r.fed, used:r.used, meadowUsed:r.meadowUsed, woolOut, feedFactor:r.feedFactor};
    }
    summary.goatSheepPen = gsSummary;
  }

  // Corn dryer — corn dried at 1.7x the raw price
  if(state.buildings.cornDryer.owned && state.buildings.cornDryer.auto && activeList('cornDryer',['driedCorn']).includes('driedCorn')){
    const amt = Math.min(BUILDINGS_INFO.cornDryer.capacity, state.inventory.corn);
    const out = amt * PRODUCT_INFO.driedCorn.ratio;
    if(amt>0){ state.inventory.corn -= amt; state.inventory.driedCorn += out; }
    state.capacityUsed.cornDryer = amt;
    summary.cornDryer = {consumed:amt, produced:out};
  }

  // Greenhouses (small + large) — grow whichever crop is activated (tomato/lettuce/chilli/garlic);
  // they spend daily upkeep cash instead of consuming a raw crop.
  // Processed smallest-first so a tight cash day funds the cheap one before the big one.
  GREENHOUSE_KEYS.forEach(key=>{
    if(state.buildings[key].owned && state.buildings[key].auto){
      const cap = BUILDINGS_INFO[key].capacity;
      const crop = state.buildings[key].activeCrop || 'tomatoes';
      const cropInfo = GREENHOUSE_CROP_INFO[crop] || GREENHOUSE_CROP_INFO.tomatoes;
      const fullUpkeep = cap * GREENHOUSE_UPKEEP_PER_UNIT;
      const upkeepPaid = Math.min(fullUpkeep, Math.max(0, state.money));
      const fundedFraction = fullUpkeep>0 ? upkeepPaid/fullUpkeep : 0;
      state.money -= upkeepPaid;
      const cropOut = cap * GREENHOUSE_YIELD_PER_UNIT * cropInfo.yieldMultiplier * fundedFraction;
      state.inventory[crop] += cropOut;
      state.capacityUsed[key] = cap * fundedFraction;
      summary[key] = {upkeepPaid, fullUpkeep, fundedFraction, crop, cropOut};
      if(upkeepPaid>0) recordFinance('expense','Greenhouse upkeep',upkeepPaid,`${BUILDINGS_INFO[key].label} upkeep growing ${cropInfo.label}`);
    }
  });

  // Dairy — buffalo milk is processed first (highest value), then regular milk, then goat milk
  if(state.buildings.dairy.owned && state.buildings.dairy.auto && activeList('dairy',['cheese','butter','goatCheese','buffaloMozzarella']).length>0){
    let remaining = BUILDINGS_INFO.dairy.capacity;
    const consumed = {}; const produced = {};
    if(remaining>0 && state.inventory.buffaloMilk>0 && activeList('dairy',['cheese','butter','goatCheese','buffaloMozzarella']).includes('buffaloMozzarella')){
      const amt = Math.min(remaining, state.inventory.buffaloMilk);
      state.inventory.buffaloMilk -= amt;
      const out = amt * PRODUCT_INFO.buffaloMozzarella.ratio;
      state.inventory.buffaloMozzarella += out;
      consumed.buffaloMilk = amt; produced.buffaloMozzarella = out;
      remaining -= amt;
    }
    if(remaining>0 && state.inventory.milk>0){
      const amt = Math.min(remaining, state.inventory.milk);
      state.inventory.milk -= amt;
      const active=activeList('dairy',['cheese','butter','goatCheese','buffaloMozzarella']);
      const cheeseShare=active.includes('cheese') ? (active.includes('butter')?0.6:1) : 0;
      const butterShare=active.includes('butter') ? (active.includes('cheese')?0.4:1) : 0;
      const cheeseOut = (amt*cheeseShare) * PRODUCT_INFO.cheese.ratio;
      const butterOut = (amt*butterShare) * PRODUCT_INFO.butter.ratio;
      state.inventory.cheese += cheeseOut; state.inventory.butter += butterOut;
      consumed.milk = amt; if(cheeseOut>0) produced.cheese = cheeseOut; if(butterOut>0) produced.butter = (produced.butter||0)+butterOut;
      remaining -= amt;
    }
    if(remaining>0 && state.inventory.goatMilk>0){
      const amt = Math.min(remaining, state.inventory.goatMilk);
      state.inventory.goatMilk -= amt;
      const active=activeList('dairy',['cheese','butter','goatCheese','buffaloMozzarella']);
      const gcShare=active.includes('goatCheese') ? (active.includes('butter')?0.6:1) : 0;
      const bShare=active.includes('butter') ? (active.includes('goatCheese')?0.4:1) : 0;
      const gcOut = (amt*gcShare) * PRODUCT_INFO.goatCheese.ratio;
      const bOut = (amt*bShare) * PRODUCT_INFO.butter.ratio;
      state.inventory.goatCheese += gcOut; state.inventory.butter += bOut;
      consumed.goatMilk = amt; if(gcOut>0) produced.goatCheese=gcOut; if(bOut>0) produced.butter=(produced.butter||0)+bOut;
      remaining -= amt;
    }
    state.capacityUsed.dairy = BUILDINGS_INFO.dairy.capacity - remaining;
    summary.dairy = {consumed, produced};
  }

  // Fish breeding — produces young Trout/Salmon and pays a monthly feed/operating cost.
  if(state.buildings.fishBreeding.owned && state.buildings.fishBreeding.auto){
    const active=activeList('fishBreeding',['trout','salmon']);
    const cost=fishFoodCost('fishBreeding');
    const paid=Math.min(cost,Math.max(0,state.money));
    state.money-=paid;
    const produced={};
    active.forEach(species=>{ const k=species==='trout'?'youngTrout':'youngSalmon'; state.inventory[k]+=FISH_BREEDING_MONTHLY_OUTPUT; produced[k]=FISH_BREEDING_MONTHLY_OUTPUT; });
    state.capacityUsed.fishBreeding=active.length;
    summary.fishBreeding={cost,paid,produced,farmHa:ownedFarmHa()};
    if(paid>0) recordFinance('expense','Fish food & breeding',paid,`Young Fish Breeding monthly cost (${ownedFarmHa()} ha farm)`);
  }
  // Fish farm — converts young fish into larger fish. Feed/operating cost scales with farm size.
  if(state.buildings.fishFarm.owned && state.buildings.fishFarm.auto){
    const active=activeList('fishFarm',['trout','salmon']);
    const cost=fishFoodCost('fishFarm');
    const paid=Math.min(cost,Math.max(0,state.money));
    state.money-=paid;
    const consumed={},produced={};
    active.forEach(species=>{
      const inKey=species==='trout'?'youngTrout':'youngSalmon'; const outKey=species;
      const amt=Math.min(FISH_FARM_INPUT_PER_SPECIES,state.inventory[inKey]);
      if(amt>0){ state.inventory[inKey]-=amt; state.inventory[outKey]+=amt*FISH_FARM_OUTPUT_RATIO; consumed[inKey]=amt; produced[outKey]=amt*FISH_FARM_OUTPUT_RATIO; }
    });
    state.capacityUsed.fishFarm=active.length;
    summary.fishFarm={cost,paid,consumed,produced,farmHa:ownedFarmHa()};
    if(paid>0) recordFinance('expense','Fish food & farm',paid,`Fish Farm monthly cost (${ownedFarmHa()} ha farm)`);
  }

  // Monthly operating costs for all non-greenhouse production facilities.
  const monthlyKeys=['grainMill','oilMill','bakery','dairy','cornDryer'];
  monthlyKeys.forEach(key=>{
    if(state.buildings[key]?.owned && state.buildings[key]?.auto){
      const cost=PRODUCTION_MONTHLY_COSTS[key];
      const paid=Math.min(cost,Math.max(0,state.money)); state.money-=paid;
      if(paid>0) recordFinance('expense','Production operating costs',paid,`${BUILDINGS_INFO[key].label} monthly operating cost`);
      summary[key]=Object.assign(summary[key]||{},{monthlyCost:cost,paid});
    }
  });
  if(state.pens.chickenPen.owned && state.pens.chickenPen.chickenCount>0){ const paid=Math.min(PRODUCTION_MONTHLY_COSTS.chickenProduction,Math.max(0,state.money)); state.money-=paid; if(paid>0) recordFinance('expense','Livestock production',paid,'Chicken production monthly cost'); }
  if(state.pens.cowPen.owned && (state.pens.cowPen.cows+state.pens.cowPen.buffaloCows)>0){ const paid=Math.min(PRODUCTION_MONTHLY_COSTS.cowProduction,Math.max(0,state.money)); state.money-=paid; if(paid>0) recordFinance('expense','Livestock production',paid,'Cow & Buffalo production monthly cost'); }
  if(state.pens.goatSheepPen.owned && (state.pens.goatSheepPen.goats+state.pens.goatSheepPen.sheep)>0){ const paid=Math.min(PRODUCTION_MONTHLY_COSTS.goatSheepProduction,Math.max(0,state.money)); state.money-=paid; if(paid>0) recordFinance('expense','Livestock production',paid,'Goat & Sheep production monthly cost'); }

  state.lastProcessed = summary;
}

function advanceMonth(){
  // advance fields
  state.fields.forEach(f=>{
    if(!f.owned) return;
    const idx = FIELD_STATE_ORDER.indexOf(f.state);
    const growingNow = ['sowed','growing1','growing2','growing3'].includes(f.state);
    if(growingNow){
      f.nitrogen = Math.max(0, Math.round((f.nitrogen - 3)*10)/10);
      f.ph = Math.round(Math.max(PH_FLOOR, f.ph - 0.03)*100)/100;
    }
    if(f.state==='sowed' || f.state==='growing1' || f.state==='growing2'){
      f.state = FIELD_STATE_ORDER[idx+1];
    } else if(f.state==='growing3'){
      f.state = 'ready';
    }
    // crops left unharvested too long wither and can no longer be harvested — grass is exempt
    if(f.crop!=='grass'){
      if(f.state==='ready'){
        f.readyDays = (f.readyDays||0) + 1;
        if(f.readyDays > WITHER_AFTER_READY_DAYS){
          f.state = 'withered';
        }
      } else {
        f.readyDays = 0;
      }
    }
  });
  // reset capacity, then auto-run mills/bakery/dairy/animal productions for the new month
  state.capacityUsed = {grainMill:0, oilMill:0, bakery:0, dairy:0, cornDryer:0, greenhouse:0, greenhouseSmall:0, fishBreeding:0, fishFarm:0};
  autoProcessAll();
  // fluctuate prices
  state.prevPrices = Object.assign({}, state.prices);
  Object.keys(state.prices).forEach(k=>{
    let base = (CROP_INFO[k]||PRODUCT_INFO[k]||RAW_GOODS_INFO[k]||BALE_INFO[k]||GREENHOUSE_CROP_INFO[k]||FISH_INFO[k]).base;
    let pct = (Math.random()-0.5)*0.12;
    if(Math.random() < 0.12){ pct += (Math.random()<0.5?-1:1)*0.15; }
    let np = state.prices[k] * (1+pct);
    np = Math.max(base*0.55, Math.min(base*1.9, np));
    state.prices[k] = np;
  });
  state.day += 1;
  toast(`${timeLabel()} begins. Monthly productions, animals and markets have updated.`);
  saveGame(); render();
}
